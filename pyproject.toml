[project]
name = "learn-agent"
version = "0.1.0"
description = "A small, observable agent harness for learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "openai>=2,<3",
  "httpx[socks]>=0.28,<1",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "httpx>=0.28,<1"]

[project.scripts]
learn-agent = "learn_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.env", "/.env.*", "/.learn-agent/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls a real model API; requires credentials and incurs API usage"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["learn_agent"]

