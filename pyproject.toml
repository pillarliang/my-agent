[project]
name = "learn-agent"
version = "0.1.0"
description = "Build an agent from a standalone model-tool-feedback loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1,<2",
  "openai>=2,<3",
  "httpx[socks]>=0.28,<1",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

# 阶段 0 独立脚本；阶段 1 在项目根目录通过 python -m learn_agent 运行。
# 当前无需构建分发包。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["learn_agent", "examples/00_plain_loop.py", "scripts/check_docs.py"]
