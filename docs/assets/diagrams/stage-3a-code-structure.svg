<text x="185" y="58">打开存储，创建或复用会话</text><text x="575" y="165">传入 store、session_id</text>
<text class="note" x="800" y="185">应用创建并关闭模型</text><text class="note" x="800" y="422">应用创建并注册工具</text>
<text class="note" x="340" y="244">核对目录</text>
<text x="575" y="350">传入 model、tools</text><text x="575" y="377">以及 store、session_id</text><text x="575" y="404">返回 RunResult</text>
