<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="eval-title eval-desc">
  <title id="eval-title">离线评测：Agent 任务沙箱隔离与多维闭环验收</title>
  <desc id="eval-desc">展示 Agent 离线评测的完整闭环：固定测试集与沙箱准备、Agent 多步自主执行、环境状态与轨迹多维打分器、评测报告产出与沙箱重置。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172133; font-size: 14px; }
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .step-title { font-size: 15px; font-weight: 700; fill: #0f766e; }
    .box-title { font-size: 14.5px; font-weight: 650; fill: #1e3a8a; }
    .desc { font-size: 12.5px; fill: #475569; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; fill: #047857; }
    .badge { font-size: 11px; font-weight: 600; fill: #b45309; }
    .arrow { fill: none; stroke: #0f766e; stroke-width: 1.8; }
    .arrow-dash { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .footer-text { font-size: 12px; fill: #64748b; }
  </style>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 顶部标题 -->
  <text x="30" y="36" class="title">离线评测（Evaluation）：Agent 任务沙箱隔离与多维闭环验收</text>

  <!-- 阶段 1：准备测试环境与初始快照 -->
  <rect x="30" y="65" width="200" height="495" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="45" y="96" class="step-title">阶段 1：沙箱与用例准备</text>
  <text x="45" y="118" class="desc">固定任务集与物理环境快照</text>

  <rect x="45" y="140" width="170" height="95" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="55" y="165" class="box-title">评测数据集 (Dataset)</text>
  <text x="55" y="188" class="desc">• 任务提示词 (Prompt)</text>
  <text x="55" y="208" class="desc">• 步数与 Token 预算</text>
  <text x="55" y="228" class="desc">• 验收标准 (Ground Truth)</text>

  <rect x="45" y="250" width="170" height="135" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="55" y="275" class="box-title">隔离沙箱 (Sandbox)</text>
  <text x="55" y="298" class="desc">• Docker / 独立临时工作区</text>
  <text x="55" y="318" class="desc">• 挂载项目源码与依赖</text>
  <text x="55" y="338" class="desc">• 注入初始 Bug / 待测文件</text>
  <text x="55" y="358" class="desc">• 隔离网络与危险命令</text>
  <text x="55" y="375" class="badge">【保证环境可回滚、无污染】</text>

  <rect x="45" y="400" width="170" height="145" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="55" y="425" class="box-title">业界代表方案</text>
  <text x="55" y="448" class="desc">• <b>Inspect AI</b> 沙箱环境</text>
  <text x="55" y="470" class="desc">• <b>SWE-bench</b> 代码仓库</text>
  <text x="55" y="492" class="desc">• <b>DeepEval</b> 测试用例集</text>
  <text x="55" y="514" class="desc">• 本地 pytest 参数化用例</text>

  <!-- 阶段 1 -> 阶段 2 箭头 -->
  <path d="M230 310 H260" class="arrow" marker-end="url(#arrow-teal)"/>

  <!-- 阶段 2：Agent 自主执行循环 -->
  <rect x="260" y="65" width="200" height="495" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="275" y="96" class="step-title">阶段 2：被测 Agent 执行</text>
  <text x="275" y="118" class="desc">多步自主决策与工具交互</text>

  <rect x="275" y="140" width="170" height="175" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="285" y="165" class="box-title">自主交互闭环 (Runner)</text>
  <text x="285" y="190" class="desc">1. 模型生成调用动作</text>
  <text x="285" y="210" class="desc">2. Policy 检查执行权限</text>
  <text x="285" y="230" class="desc">3. 在沙箱执行真实工具</text>
  <text x="285" y="250" class="desc">4. 真实回执追加回上下文</text>
  <text x="285" y="270" class="desc">5. 循环直到给出最终结果</text>
  <text x="285" y="295" class="code">status: finished / error</text>

  <rect x="275" y="330" width="170" height="215" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="285" y="355" class="box-title">产出两大评测物料</text>
  <text x="285" y="380" class="desc"><b>物料 A：环境副作用变更</b></text>
  <text x="285" y="400" class="desc">• 沙箱中文件的修改 (Diff)</text>
  <text x="285" y="420" class="desc">• 新增配置文件 / 代码产物</text>
  <text x="285" y="445" class="desc"><b>物料 B：执行决策轨迹</b></text>
  <text x="285" y="465" class="desc">• 每步调用工具与参数</text>
  <text x="285" y="485" class="desc">• 消耗步数与总 Token</text>
  <text x="285" y="505" class="desc">• 最终返回的文本回答</text>
  <text x="285" y="530" class="badge">【真实产物比文本更重要】</text>

  <!-- 阶段 2 -> 阶段 3 箭头 -->
  <path d="M460 410 H490" class="arrow" marker-end="url(#arrow-teal)"/>

  <!-- 阶段 3：多维打分器 (Scorers) -->
  <rect x="490" y="65" width="220" height="495" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="505" y="96" class="step-title">阶段 3：多维打分器矩阵</text>
  <text x="505" y="118" class="desc">从状态、行为到质量全面检验</text>

  <!-- 打分器 1：确定性代码检查 -->
  <rect x="505" y="140" width="190" height="110" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="515" y="165" class="box-title">1. 环境状态断言 (State Diff)</text>
  <text x="515" y="188" class="desc">• 在沙箱执行 pytest 单元测试</text>
  <text x="515" y="208" class="desc">• 验证目标产物文件是否存在</text>
  <text x="515" y="228" class="desc">• 检查核心字段或正则模式匹配</text>
  <text x="515" y="244" class="badge">【确定性检查，零幻觉偏见】</text>

  <!-- 打分器 2：轨迹与效率 -->
  <rect x="505" y="260" width="190" height="110" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="515" y="285" class="box-title">2. 轨迹决策分析 (Trajectory)</text>
  <text x="515" y="308" class="desc">• 工具选择准确度 (Correctness)</text>
  <text x="515" y="328" class="desc">• 步数效率 (Step Efficiency)</text>
  <text x="515" y="348" class="desc">• 冗余调用与死循环震荡检测</text>
  <text x="515" y="364" class="code">metric: loop_detected == False</text>

  <!-- 打分器 3：LLM-as-a-Judge -->
  <rect x="505" y="380" width="190" height="95" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="515" y="405" class="box-title">3. 语义验收 (LLM Judge)</text>
  <text x="515" y="428" class="desc">• 依据评分量规 (Rubric) 打分</text>
  <text x="515" y="448" class="desc">• 评估解释充分性与逻辑自洽性</text>
  <text x="515" y="468" class="desc">• 提示词注入攻击防御有效性</text>

  <!-- 阶段 3 底部综合打分 -->
  <rect x="505" y="485" width="190" height="60" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="515" y="508" class="box-title">权重综合判定</text>
  <text x="515" y="530" class="code">Final = State(60%) + Traj(40%)</text>

  <!-- 阶段 3 -> 阶段 4 箭头 -->
  <path d="M710 310 H740" class="arrow" marker-end="url(#arrow-teal)"/>

  <!-- 阶段 4：报告生成与沙箱重置 -->
  <rect x="740" y="65" width="150" height="495" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="755" y="96" class="step-title">阶段 4：报告与重置</text>
  <text x="755" y="118" class="desc">汇总输出与回滚销毁</text>

  <rect x="755" y="140" width="120" height="230" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="765" y="165" class="box-title">评测综合报告</text>
  <text x="765" y="190" class="desc">• <b>Pass@1</b> 成功率</text>
  <text x="765" y="212" class="desc">• <b>Pass@k</b> 稳定性</text>
  <text x="765" y="234" class="desc">• 任务平均步数</text>
  <text x="765" y="256" class="desc">• Token 消耗均值</text>
  <text x="765" y="278" class="desc">• 耗时分布 (P50/P95)</text>
  <text x="765" y="300" class="desc">• 失败归因树</text>
  <text x="765" y="322" class="desc">• 版本对比 Diff</text>
  <text x="765" y="350" class="code">Status: PASSED</text>

  <rect x="755" y="385" width="120" height="160" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="765" y="410" class="box-title">沙箱重置与清理</text>
  <text x="765" y="435" class="desc">• 销毁临时目录</text>
  <text x="765" y="457" class="desc">• 还原 Git 干净状态</text>
  <text x="765" y="479" class="desc">• 释放占用端口</text>
  <text x="765" y="501" class="desc">• 准备下一用例</text>
  <text x="765" y="530" class="badge">【无状态残留】</text>

  <!-- 阶段 4 回滚重置循环箭头 -->
  <path d="M815 550 V580 H130 V560" class="arrow-dash" marker-end="url(#arrow-gray)"/>
  <text x="475" y="595" class="footer-text" text-anchor="middle">重置沙箱并进入下一任务用例评测（批量并发或顺序运行）</text>
</svg>

