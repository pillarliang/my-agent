t></g><g class="am-node am-node--rect" data-key="解析与参数校验" data-step="1"><rect class="am-node-shape" x="27" y="176" width="119" height="35" rx="3"/><text x="86.5" y="193.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">解析与参数校验</text></g><g class="am-node am-node--rect" data-key="资源与权限检查" data-step="2"><rect class="am-node-shape" x="27" y="257" width="119" height="35" rx="3"/><text x="86.5" y="274.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">资源与权限检查</text></g><g class="am-node am-node--rect" data-key="执行后端" data-step="3"><rect class="am-node-shape" x="46.5" y="338" width="80" height="35" rx="3"/><text x="86.5" y="355.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">执行后端</text></g><g class="am-node am-node--rect" data-key="回执与产物引用" data-step="4"><rect class="am-node-shape" x="27" y="419" width="119" height="35" rx="3"/><text x="86.5" y="436.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">回执与产物引用</text></g><g class="am-node am-node--rect" data-key="Runner" data-step="5"><rect class="am-node-shape" x="51.4" y="518" width="70.1" height="35" rx="3"/><text x="86.5" y="535.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Runner</text></g></g></svg>
