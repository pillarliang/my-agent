<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-label="未来委派协作示例：编排层负责分配与汇合，子 Runner 使用自身模块执行；当前尚无子运行协议。">
<title>未来委派协作示例：编排层负责分配与汇合，子 Runner 使用自身模块执行；当前尚无子运行协议。</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172133;font-size:14px}.life{stroke:#c9d2df;stroke-dasharray:5 5}.arrow{fill:none;stroke:#40516b;stroke-width:1.5}.return{stroke-dasharray:6 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/></marker></defs>
<rect x="45" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="140" y="43" text-anchor="middle">主任务／编排层</text>
<path class="life" d="M140 60 V513"/>
<rect x="285" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="380" y="43" text-anchor="middle">子 Runner</text>
<path class="life" d="M380 60 V513"/>
<rect x="525" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="620" y="43" text-anchor="middle">Context / Model / Tools</text>
<path class="life" d="M620 60 V513"/>
<rect x="765" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="860" y="43" text-anchor="middle">记录层</text>
<path class="life" d="M860 60 V513"/>
<text x="500.0" y="106" text-anchor="middle">记录父子任务 ID 与输入版本</text>
<path class="arrow" d="M140 118 H860" marker-end="url(#arrow)"/>
<text x="260.0" y="152" text-anchor="middle">子任务、输入快照</text>
<text x="260.0" y="170" text-anchor="middle">权限范围与预算</text>
<path class="arrow" d="M140 182 H380" marker-end="url(#arrow)"/>
<text x="500.0" y="234" text-anchor="middle">设有预算的请求与受控工具调用</text>
<path class="arrow" d="M380 246 H620" marker-end="url(#arrow)"/>
<text x="500.0" y="280" text-anchor="middle">模型响应、真实回执</text>
<text x="500.0" y="298" text-anchor="middle">或错误</text>
<path class="arrow return" d="M620 310 H380" marker-end="url(#arrow)"/>
<text x="620.0" y="362" text-anchor="middle">保存子任务记录与最终状态</text>
<path class="arrow" d="M380 374 H860" marker-end="url(#arrow)"/>
<text x="260.0" y="408" text-anchor="middle">结果、证据、用量</text>
<text x="260.0" y="426" text-anchor="middle">未解决项或失败</text>
<path class="arrow return" d="M380 438 H140" marker-end="url(#arrow)"/>
<text x="500.0" y="490" text-anchor="middle">保存汇合结论与实际检查</text>
<path class="arrow" d="M140 502 H860" marker-end="url(#arrow)"/>
<text x="500.0" y="546" text-anchor="middle">实线：发起调用或提交；虚线：返回结果或失败。角色表示职责，不限定具体类。</text></svg>
