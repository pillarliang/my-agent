<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 686" role="img" aria-label="通用记录协作：执行记录的保存、历史选择与界面查询各有职责；普通查询不会重放动作。">
<title>通用记录协作：执行记录的保存、历史选择与界面查询各有职责；普通查询不会重放动作。</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172133;font-size:14px}.life{stroke:#c9d2df;stroke-dasharray:5 5}.arrow{fill:none;stroke:#40516b;stroke-width:1.5}.return{stroke-dasharray:6 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/></marker></defs>
<rect x="45" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="140" y="43" text-anchor="middle">Runner</text>
<path class="life" d="M140 60 V641"/>
<rect x="285" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="380" y="43" text-anchor="middle">会话／记录层</text>
<path class="life" d="M380 60 V641"/>
<rect x="525" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="620" y="43" text-anchor="middle">查询入口</text>
<path class="life" d="M620 60 V641"/>
<text x="260.0" y="106" text-anchor="middle">创建运行并保存用户任务</text>
<path class="arrow" d="M140 118 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="170" text-anchor="middle">运行 ID 或拒绝原因</text>
<path class="arrow return" d="M380 182 H140" marker-end="url(#arrow)"/>
<text x="260.0" y="234" text-anchor="middle">逐步提交请求、响应和回执</text>
<path class="arrow" d="M140 246 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="298" text-anchor="middle">提交结果或存储错误</text>
<path class="arrow return" d="M380 310 H140" marker-end="url(#arrow)"/>
<text x="260.0" y="362" text-anchor="middle">共同提交最终状态与结果</text>
<path class="arrow" d="M140 374 H380" marker-end="url(#arrow)"/>
<text x="500.0" y="426" text-anchor="middle">按会话 ID 查询</text>
<path class="arrow" d="M620 438 H380" marker-end="url(#arrow)"/>
<text x="500.0" y="490" text-anchor="middle">完整记录或查询错误</text>
<path class="arrow return" d="M380 502 H620" marker-end="url(#arrow)"/>
<text x="260.0" y="554" text-anchor="middle">新任务读取可用历史</text>
<path class="arrow" d="M140 566 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="618" text-anchor="middle">历史记录供 Context 选择</text>
<path class="arrow return" d="M380 630 H140" marker-end="url(#arrow)"/>
<text x="380.0" y="674" text-anchor="middle">实线：发起调用或提交；虚线：返回结果或失败。角色表示职责，不限定具体类。</text></svg>
