<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 363 669"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
/* Embedded previews can lose html[data-theme]; the fallbacks keep diagrams readable, and defined theme variables still win. */
.am-diagram svg { max-width: 100%; height: auto; font-family: var(--font-sans, sans-serif); }
.am-diagram text { fill: var(--ink, #16181d); font-size: 13px; }
/* Diagram tokens (docs/reference.md, "Diagram tokens"): each painted part reads an optional token and falls back to the look it always had,
   so a theme that sets none of them draws the same diagram. Font family, size and weight are not tokens: diagram text is measured for the sans font. */
.am-node-shape { fill: var(--node-fill, var(--paper, #ffffff)); stroke: var(--node-stroke, var(--line, #1d2026)); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); }
/* A cylinder is two shapes (body, then cap): only the body casts the shadow. */
.am-node-shape ~ .am-node-shape { filter: none; }
/* The corner radius is an SVG attribute (the fallback for Safari before 17.4, which ignores a CSS rx); the default here equals the attribute. A pill and a diamond keep their shape. */
.am-node--rect .am-node-shape, .am-node--er .am-node-shape { rx: var(--node-radius, 3px); }
.am-node--hi .am-node-shape { fill: var(--hi-fill, var(--accent-bg, #e4ecf8)); stroke: var(--hi-stroke, var(--accent, #1d5fbf)); }
.am-diagram .am-node-text { fill: var(--node-text, var(--ink, #16181d)); }
.am-node--hi text { fill: var(--hi-text, var(--accent, #1d5fbf)); font-weight: 600; }
.am-diagram .am-node--hi .am-node-text { fill: var(--hi-text, var(--accent, #1d5fbf)); }
.am-edge { fill: none; stroke: var(--edge-color, var(--ink-2, #4b5260)); stroke-width: var(--edge-width, 1.3); }
.am-edge--dashed { stroke-dasharray: 5 4; }
.am-arrow { fill: var(--edge-color, var(--ink-2, #4b5260)); }
.am-edge-label rect { fill: var(--paper, #ffffff); }
.am-diagram .am-edge-label text { fill: var(--edge-label, var(--accent, #1d5fbf)); font-size: 11.5px; }
.am-cluster { fill: var(--cluster-fill, var(--fill, #f3f5f8)); stroke: var(--cluster-stroke, var(--line-2, #d6dae1)); stroke-width: 1; stroke-dasharray: 4 3; }
.am-diagram .am-cluster-label { fill: var(--ink-2, #4b5260); font: 11px var(--font-mono, monospace); }
/* The PK / FK / UK marks of an entity follow the node text, and the highlighted text in a highlighted entity, so they stay readable on the theme's fills. */
.am-diagram .am-er-key { fill: var(--node-text, var(--ink-2, #4b5260)); }
.am-diagram .am-node--hi .am-er-key { fill: var(--hi-text, var(--ink-2, #4b5260)); }
.am-lifeline { stroke: var(--lifeline-color, var(--ink-3, #8b929e)); stroke-width: 1; stroke-dasharray: 4 4; }
/* An actor (and the box of a divider) looks like a node unless the theme sets the actor tokens. */
.am-actor { fill: var(--actor-fill, var(--node-fill, var(--paper, #ffffff))); stroke: var(--actor-stroke, var(--node-stroke, var(--line, #1d2026))); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); rx: var(--node-radius, 2px); }
.am-diagram .am-actor-text { fill: var(--actor-text, var(--node-text, var(--ink, #16181d))); }
.am-note { fill: var(--note-fill, var(--warn-bg, #fdf3e2)); stroke: var(--note-stroke, var(--warn, #a8620a)); stroke-width: var(--note-width, 1); rx: var(--note-radius, 2px); }
.am-diagram .am-step { fill: var(--ink-3, #8b929e); font: 10px var(--font-mono, monospace); }


svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#16181d}
</style><defs xmlns="http://www.w3.org/2000/svg"><marker id="diagram-module-context-1-panel-B-1-element-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><g xmlns="http://www.w3.org/2000/svg"/><g xmlns="http://www.w3.org/2000/svg"><g data-step="0"><path class="am-edge" d="M274,49 L274,60.5 Q274,72 248.3,83.5 L222.6,95" marker-end="url(#diagram-module-context-1-panel-B-1-element-2)"/></g><g data-step="1"><path class="am-edge" d="M93,49 L93,60.5 Q93,72 118.7,83.5 L144.4,95" marker-end="url(#diagram-module-context-1-panel-B-1-element-2)"/></g><g data-step="2"><path class="am-edge" d="M183.5,130 L183.5,141.5 Q183.5,153 183.5,164.5 L183.5,176" marker-end="url(#diagram-module-context-1-panel-B-1-element-2)"/></g><g data-step="3"><path class="am-edge" d="M183.5,211 L183.5,222.5 Q183.5,234 183.5,245.5 L183.5,257" marker-end="url(#diagram-module-context-1-panel-B-1-element-2)"/></g><g data-step="4"><path class="am-edge" d="M183.5,292 L183.5,303.5 Q183.5,315 183.5,326.5 L183.5,338" marker-end="url(#diagram-module-context-1-panel-B-1-element-2)"/></g><g data-step="5"><path class="am-edge" d="M183.5,373 L183.5,384.5 Q183.5,396 183.5,407.5 L183.5,419" marker-end="url(#diagram-module-context-1-panel-B-1-element-2)"/></g><g data-step="6"><path class="am-edge" d="M183.5,454 L183.5,465.5 Q183.5,477 183.5,488.5 L183.5,500" marker-end="url(#diagram-module-context-1-panel-B-1-element-2)"/></g><g data-step="7"><path class="am-edge" d="M209.3,545 L242,566.5 Q274.8,588 274.8,604 L274.8,620" marker-end="url(#diagram-module-context-1-panel-B-1-element-2)"/><g class="am-edge-label"><rect x="264" y="579" width="21.5" height="18" rx="3"/><text x="274.8" y="588" text-anchor="middle" dominant-baseline="central">是</text></g></g><g data-step="8"><path class="am-edge" d="M157.7,545 L125,566.5 Q92.2,588 92.2,604 L92.2,620" marker-end="url(#diagram-module-context-1-panel-B-1-element-2)"/><g class="am-edge-label"><rect x="81.5" y="579" width="21.5" height="18" rx="3"/><text x="92.2" y="588" text-anchor="middle" dominant-baseline="central">否</text></g></g></g><g xmlns="http://www.w3.org/2000/svg"><g class="am-node am-node--rect" data-key="当前要求与执行过程" data-step="0"><rect class="am-node-shape" x="208" y="14" width="132" height="35" rx="3"/><text x="274" y="31.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">当前要求与执行过程</text></g><g class="am-node am-node--rect" data-key="收集候选内容" data-step="0"><rect class="am-node-shape" x="130.5" y="95" width="106" height="35" rx="3"/><text x="183.5" y="112.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">收集候选内容</text></g><g class="am-node am-node--rect" data-key="历史与资料及工具定义" data-step="1"><rect class="am-node-shape" x="14" y="14" width="158" height="35" rx="3"/><text x="93" y="31.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">历史与资料及工具定义</text></g><g class="am-node am-node--rect" data-key="核对来源与访问范围" data-step="2"><rect class="am-node-shape" x="111" y="176" width="145" height="35" rx="3"/><text x="183.5" y="193.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">核对来源与访问范围</text></g><g class="am-node am-node--rect" data-key="选择必需与相关片段" data-step="3"><rect class="am-node-shape" x="111" y="257" width="145" height="35" rx="3"/><text x="183.5" y="274.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">选择必需与相关片段</text></g><g class="am-node am-node--rect" data-key="预算不足时选择策略" data-step="4"><rect class="am-node-shape" x="111" y="338" width="145" height="35" rx="3"/><text x="183.5" y="355.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">预算不足时选择策略</text></g><g class="am-node am-node--rect" data-key="编码与预算复核" data-step="5"><rect class="am-node-shape" x="124" y="419" width="119" height="35" rx="3"/><text x="183.5" y="436.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">编码与预算复核</text></g><g class="am-node am-node--diamond" data-key="能够发送?" data-step="6"><polygon class="am-node-shape" points="183.5,500 249,528 183.5,556 118,528"/><text x="183.5" y="528" text-anchor="middle" dominant-baseline="central" class="am-node-text">能够发送?</text></g><g class="am-node am-node--rect" data-key="输入视图返回Runner" data-step="7"><rect class="am-node-shape" x="200.7" y="620" width="148.1" height="35" rx="3"/><text x="274.8" y="637.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">输入视图返回 Runner</text></g><g class="am-node am-node--rect" data-key="明确停止或缩小输入" data-step="8"><rect class="am-node-shape" x="19.7" y="620" width="145" height="35" rx="3"/><text x="92.2" y="637.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">明确停止或缩小输入</text></g></g></svg>
