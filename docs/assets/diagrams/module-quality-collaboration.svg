<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 622" role="img" aria-label="可选评测协作示意，当前未接入独立检查器或观测流程；检查失败与运行失败分别记录。">
<title>可选评测协作示意，当前未接入独立检查器或观测流程；检查失败与运行失败分别记录。</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172133;font-size:14px}.life{stroke:#c9d2df;stroke-dasharray:5 5}.arrow{fill:none;stroke:#40516b;stroke-width:1.5}.return{stroke-dasharray:6 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/></marker></defs>
<rect x="45" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="140" y="43" text-anchor="middle">测试／实验入口</text>
<path class="life" d="M140 60 V577"/>
<rect x="285" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="380" y="43" text-anchor="middle">应用与 Runner</text>
<path class="life" d="M380 60 V577"/>
<rect x="525" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="620" y="43" text-anchor="middle">检查器</text>
<path class="life" d="M620 60 V577"/>
<rect x="765" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="860" y="43" text-anchor="middle">观测／评测记录</text>
<path class="life" d="M860 60 V577"/>
<text x="260.0" y="106" text-anchor="middle">固定任务、资料与配置</text>
<path class="arrow" d="M140 118 H380" marker-end="url(#arrow)"/>
<text x="620.0" y="170" text-anchor="middle">过程事件、回执、用量等证据</text>
<path class="arrow" d="M380 182 H860" marker-end="url(#arrow)"/>
<text x="260.0" y="234" text-anchor="middle">运行结果或运行错误</text>
<path class="arrow return" d="M380 246 H140" marker-end="url(#arrow)"/>
<text x="380.0" y="298" text-anchor="middle">标准、结果与实际产物</text>
<path class="arrow" d="M140 310 H620" marker-end="url(#arrow)"/>
<text x="380.0" y="362" text-anchor="middle">结论、证据或检查错误</text>
<path class="arrow return" d="M620 374 H140" marker-end="url(#arrow)"/>
<text x="500.0" y="426" text-anchor="middle">记录检查范围、版本和结论</text>
<path class="arrow" d="M140 438 H860" marker-end="url(#arrow)"/>
<text x="500.0" y="490" text-anchor="middle">查询／比较实验记录</text>
<path class="arrow" d="M140 502 H860" marker-end="url(#arrow)"/>
<text x="500.0" y="554" text-anchor="middle">可追溯报告或查询错误</text>
<path class="arrow return" d="M860 566 H140" marker-end="url(#arrow)"/>
<text x="500.0" y="610" text-anchor="middle">实线：发起调用或提交；虚线：返回结果或失败。角色表示职责，不限定具体类。</text></svg>
