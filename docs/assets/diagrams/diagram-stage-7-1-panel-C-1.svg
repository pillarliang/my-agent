<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 376 405"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
/* Embedded previews can lose html[data-theme]; the fallbacks keep diagrams readable, and defined theme variables still win. */
.am-diagram svg { max-width: 100%; height: auto; font-family: var(--font-sans, sans-serif); }
.am-diagram text { fill: var(--ink, #16181d); font-size: 13px; }
/* Diagram tokens (docs/reference.md, "Diagram tokens"): each painted part reads an optional token and falls back to the look it always had,
   so a theme that sets none of them draws the same diagram. Font family, size and weight are not tokens: diagram text is measured for the sans font. */
.am-node-shape { fill: var(--node-fill, var(--paper, #ffffff)); stroke: var(--node-stroke, var(--line, #1d2026)); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); }
/* A cylinder is two shapes (body, then cap): only the body casts the shadow. */
.am-node-shape ~ .am-node-shape { filter: none; }
/* The corner radius is an SVG attribute (the fallback for Safari before 17.4, which ignores a CSS rx); the default here equals the attribute. A pill and a diamond keep their shape. */
.am-node--rect .am-node-shape, .am-node--er .am-node-shape { rx: var(--node-radius, 3px); }
.am-node--hi .am-node-shape { fill: var(--hi-fill, var(--accent-bg, #e4ecf8)); stroke: var(--hi-stroke, var(--accent, #1d5fbf)); }
.am-diagram .am-node-text { fill: var(--node-text, var(--ink, #16181d)); }
.am-node--hi text { fill: var(--hi-text, var(--accent, #1d5fbf)); font-weight: 600; }
.am-diagram .am-node--hi .am-node-text { fill: var(--hi-text, var(--accent, #1d5fbf)); }
.am-edge { fill: none; stroke: var(--edge-color, var(--ink-2, #4b5260)); stroke-width: var(--edge-width, 1.3); }
.am-edge--dashed { stroke-dasharray: 5 4; }
.am-arrow { fill: var(--edge-color, var(--ink-2, #4b5260)); }
.am-edge-label rect { fill: var(--paper, #ffffff); }
.am-diagram .am-edge-label text { fill: var(--edge-label, var(--accent, #1d5fbf)); font-size: 11.5px; }
.am-cluster { fill: var(--cluster-fill, var(--fill, #f3f5f8)); stroke: var(--cluster-stroke, var(--line-2, #d6dae1)); stroke-width: 1; stroke-dasharray: 4 3; }
.am-diagram .am-cluster-label { fill: var(--ink-2, #4b5260); font: 11px var(--font-mono, monospace); }
/* The PK / FK / UK marks of an entity follow the node text, and the highlighted text in a highlighted entity, so they stay readable on the theme's fills. */
.am-diagram .am-er-key { fill: var(--node-text, var(--ink-2, #4b5260)); }
.am-diagram .am-node--hi .am-er-key { fill: var(--hi-text, var(--ink-2, #4b5260)); }
.am-lifeline { stroke: var(--lifeline-color, var(--ink-3, #8b929e)); stroke-width: 1; stroke-dasharray: 4 4; }
/* An actor (and the box of a divider) looks like a node unless the theme sets the actor tokens. */
.am-actor { fill: var(--actor-fill, var(--node-fill, var(--paper, #ffffff))); stroke: var(--actor-stroke, var(--node-stroke, var(--line, #1d2026))); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); rx: var(--node-radius, 2px); }
.am-diagram .am-actor-text { fill: var(--actor-text, var(--node-text, var(--ink, #16181d))); }
.am-note { fill: var(--note-fill, var(--warn-bg, #fdf3e2)); stroke: var(--note-stroke, var(--warn, #a8620a)); stroke-width: var(--note-width, 1); rx: var(--note-radius, 2px); }
.am-diagram .am-step { fill: var(--ink-3, #8b929e); font: 10px var(--font-mono, monospace); }


svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#16181d}
</style><defs xmlns="http://www.w3.org/2000/svg"><marker id="diagram-stage-7-1-panel-C-1-element-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><g xmlns="http://www.w3.org/2000/svg"/><g xmlns="http://www.w3.org/2000/svg"><g data-step="0"><path class="am-edge" d="M295.5,49 L295.5,65 Q295.5,81 289.4,97 L283.4,113" marker-end="url(#diagram-stage-7-1-panel-C-1-element-2)"/></g><g data-step="1"><path class="am-edge" d="M281.1,148 L283.9,159.5 Q286.8,171 272.9,182.5 L259,194" marker-end="url(#diagram-stage-7-1-panel-C-1-element-2)"/></g><g data-step="1"><path class="am-edge" d="M244.6,147.6 L222.6,159.3 Q200.5,171 164.1,182.5 L127.7,194" marker-end="url(#diagram-stage-7-1-panel-C-1-element-2)"/></g><g data-step="2"><path class="am-edge" d="M237.9,229 L237.9,240.5 Q237.9,252 216.3,263.5 L194.6,275" marker-end="url(#diagram-stage-7-1-panel-C-1-element-2)"/></g><g data-step="3"><path class="am-edge" d="M72.2,229 L72.2,240.5 Q72.2,252 97.6,263.5 L123,275" marker-end="url(#diagram-stage-7-1-panel-C-1-element-2)"/></g><g data-step="4"><path class="am-edge" d="M161.7,310 L161.7,321.5 Q161.7,333 161.7,344.5 L161.7,356" marker-end="url(#diagram-stage-7-1-panel-C-1-element-2)"/></g><g data-step="5"><path class="am-edge am-edge--dashed" d="M144.1,49 L176.7,65 Q209.3,81 231.1,97 L252.9,113" marker-end="url(#diagram-stage-7-1-panel-C-1-element-2)"/><g class="am-edge-label"><rect x="192.8" y="72" width="33" height="18" rx="3"/><text x="209.3" y="81" text-anchor="middle" dominant-baseline="central">限制权限</text></g></g><g data-step="6"><path class="am-edge am-edge--dashed" d="M123.7,49 L137.7,65 Q151.7,81 151.7,105.8 Q151.7,130.5 151.7,150.8 Q151.7,171 176.2,182.5 L200.7,194" marker-end="url(#diagram-stage-7-1-panel-C-1-element-2)"/><g class="am-edge-label"><rect x="135.2" y="121.5" width="33" height="18" rx="3"/><text x="151.7" y="130.5" text-anchor="middle" dominant-baseline="central">限制权限</text></g></g><g data-step="7"><path class="am-edge am-edge--dashed" d="M87.1,49 L67.5,65 Q48,81 48,105.8 Q48,130.5 48,150.8 Q48,171 54.9,182.5 L61.7,194" marker-end="url(#diagram-stage-7-1-panel-C-1-element-2)"/><g class="am-edge-label"><rect x="31.5" y="121.5" width="33" height="18" rx="3"/><text x="48" y="130.5" text-anchor="middle" dominant-baseline="central">限制权限</text></g></g></g><g xmlns="http://www.w3.org/2000/svg"><g class="am-node am-node--rect" data-key="用户目标与总预算" data-step="0"><rect class="am-node-shape" x="229.5" y="14" width="132" height="35" rx="3"/><text x="295.5" y="31.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">用户目标与总预算</text></g><g class="am-node am-node--rect" data-key="主Run" data-step="0"><rect class="am-node-shape" x="244.6" y="113" width="64.4" height="35" rx="3"/><text x="276.8" y="130.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">主 Run</text></g><g class="am-node am-node--rect" data-key="子Run读取资料" data-step="1"><rect class="am-node-shape" x="179.7" y="194" width="116.4" height="35" rx="3"/><text x="237.9" y="211.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">子 Run 读取资料</text></g><g class="am-node am-node--rect" data-key="子Run核对来源" data-step="1"><rect class="am-node-shape" x="14" y="194" width="116.4" height="35" rx="3"/><text x="72.2" y="211.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">子 Run 核对来源</text></g><g class="am-node am-node--rect" data-key="汇合结果证据与未知项" data-step="2"><rect class="am-node-shape" x="82.7" y="275" width="158" height="35" rx="3"/><text x="161.7" y="292.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">汇合结果证据与未知项</text></g><g class="am-node am-node--rect" data-key="检查实际产物并形成结论" data-step="4"><rect class="am-node-shape" x="76.2" y="356" width="171" height="35" rx="3"/><text x="161.7" y="373.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">检查实际产物并形成结论