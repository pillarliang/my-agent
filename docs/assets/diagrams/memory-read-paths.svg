<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" role="img" aria-labelledby="read-title read-desc">
<title id="read-title">Memory 读取与注入模型的三条通道</title>
<desc id="read-desc">展示启动全量加载、请求前动态检索以及运行期按需查阅三种读取路径，及其作用域过滤、冲突消解与上下文预算控制流程。</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172133; font-size: 15px; }
  .head { font-size: 18px; font-weight: 650; }
  .title { font-size: 20px; font-weight: 700; fill: #172133; }
  .small { font-size: 13.5px; fill: #526176; }
  .badge { font-size: 12px; font-weight: 600; fill: #1d5fbf; }
  .arrow { fill: none; stroke: #40516b; stroke-width: 1.6; }
</style>
<defs>
  <marker id="read-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/>
  </marker>
</defs>

<!-- 顶部大标题 -->
<text x="24" y="32" class="title" text-anchor="start">Memory 读取与注入模型的三条通道</text>

<!-- 顶部存储源 -->
<rect x="24" y="55" width="792" height="85" rx="8" fill="#eff6ff" stroke="#7ca4d8" stroke-width="1.5"/>
<text x="40" y="85" class="head" text-anchor="start">持久化存储源：项目有效记忆库</text>
<text x="40" y="112" class="small" text-anchor="start">包含全局偏好、工作区项目约定、模块规则或外部向量索引；按当前工作区路径与用户 ID 进行作用域隔离。</text>

<!-- 向下分支箭头 -->
<path d="M148 140 V175" class="arrow" marker-end="url(#read-arrow)"/>
<path d="M420 140 V175" class="arrow" marker-end="url(#read-arrow)"/>
<path d="M692 140 V175" class="arrow" marker-end="url(#read-arrow)"/>

<!-- 中间三种读取机制 -->
<!-- 通道 1 -->
<rect x="24" y="180" width="248" height="155" rx="8" fill="#f4f7fb" stroke="#c2cddd" stroke-width="1.5"/>
<text x="40" y="210" class="head" text-anchor="start">通道 1：启动时全量加载</text>
<text x="40" y="237" class="small" text-anchor="start">• 代表：pi、Claude Code、阶段 5</text>
<text x="40" y="259" class="small" text-anchor="start">• 机制：run_task() 启动读取全文</text>
<text x="40" y="281" class="small" text-anchor="start">• 快照：单任务全程锁定同一份快照</text>
<text x="40" y="303" class="small" text-anchor="start">• 优势：零工具检索延迟，第 1 步立即可用</text>
<text x="40" y="323" class="badge" text-anchor="start">【短规则首选，开箱即用】</text>

<!-- 通道 2 -->
<rect x="296" y="180" width="248" height="155" rx="8" fill="#f4f7fb" stroke="#c2cddd" stroke-width="1.5"/>
<text x="312" y="210" class="head" text-anchor="start">通道 2：请求前动态检索</text>
<text x="312" y="237" class="small" text-anchor="start">• 代表：LangGraph Store、AgentScope</text>
<text x="312" y="259" class="small" text-anchor="start">• 机制：组装请求前用本次问题检索</text>
<text x="312" y="281" class="small" text-anchor="start">• 策略：关键词 FTS 或向量 Top-K</text>
<text x="312" y="303" class="small" text-anchor="start">• 优势：知识海量时消减无关 Token 占用</text>
<text x="312" y="323" class="badge" text-anchor="start">【多租户、知识库场景首选】</text>

<!-- 通道 3 -->
<rect x="568" y="180" width="248" height="155" rx="8" fill="#f4f7fb" stroke="#c2cddd" stroke-width="1.5"/>
<text x="584" y="210" class="head" text-anchor="start">通道 3：运行期按需查阅</text>
<text x="584" y="237" class="small" text-anchor="start">• 代表：MemGPT 归档库、分主题索引</text>
<text x="584" y="259" class="small" text-anchor="start">• 机制：上下文仅给简短目录索引</text>
<text x="584" y="281" class="small" text-anchor="start">• 触发：模型需要时自主调工具读取正文</text>
<text x="584" y="303" class="small" text-anchor="start">• 优势：渐进披露，单轮输入极小化</text>
<text x="584" y="323" class="badge" text-anchor="start">【适合庞大复杂的主题文档】</text>

<!-- 向下汇聚箭头 -->
<path d="M148 335 V370" class="arrow" marker-end="url(#read-arrow)"/>
<path d="M420 335 V370" class="arrow" marker-end="url(#read-arrow)"/>
<path d="M692 335 V370" class="arrow" marker-end="url(#read-arrow)"/>

<!-- 底部 Context Manager 预算与组装 -->
<rect x="24" y="375" width="792" height="125" rx="8" fill="#fef9f0" stroke="#d9a74a" stroke-width="1.5"/>
<text x="40" y="405" class="head" text-anchor="start">Context Manager 组装与安全护栏（组装进 ModelRequest 前）</text>
<text x="40" y="432" class="small" text-anchor="start">1. 作用域过滤（Scope Isolation）：确认记忆来源合法且属于当前工作区，绝不越权注入其他租户知识。</text>
<text x="40" y="455" class="small" text-anchor="start">2. 三层冲突消解优先级：本次用户明确要求 &gt; 当前读取的 Memory 默认约定 &gt; 历史对话中的旧记录。</text>
<text x="40" y="478" class="small" text-anchor="start">3. 输入预算严密复核：记忆正文与来源标记一并计入 Token 预算；超出预算时明确提示精简，严禁盲目发送。</text>

<!-- 底部规则说明 -->
<text x="24" y="534" class="head" text-anchor="start">核心铁律：注入模型的是不可变快照或检索片段；读取 Memory 是纯只读操作，绝不重新执行外部工具。</text>
<text x="24" y="558" class="small" text-anchor="start">模型看到的是“项目背景资料与约束”，工具调用仍须由 Policy 检查授权，记忆中的文字不能篡改系统安全策略。</text>
</svg>