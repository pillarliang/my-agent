<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 607 624"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
/* Embedded previews can lose html[data-theme]; the fallbacks keep diagrams readable, and defined theme variables still win. */
.am-diagram svg { max-width: 100%; height: auto; font-family: var(--font-sans, sans-serif); }
.am-diagram text { fill: var(--ink, #16181d); font-size: 13px; }
/* Diagram tokens (docs/reference.md, "Diagram tokens"): each painted part reads an optional token and falls back to the look it always had,
   so a theme that sets none of them draws the same diagram. Font family, size and weight are not tokens: diagram text is measured for the sans font. */
.am-node-shape { fill: var(--node-fill, var(--paper, #ffffff)); stroke: var(--node-stroke, var(--line, #1d2026)); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); }
/* A cylinder is two shapes (body, then cap): only the body casts the shadow. */
.am-node-shape ~ .am-node-shape { filter: none; }
/* The corner radius is an SVG attribute (the fallback for Safari before 17.4, which ignores a CSS rx); the default here equals the attribute. A pill and a diamond keep their shape. */
.am-node--rect .am-node-shape, .am-node--er .am-node-shape { rx: var(--node-radius, 3px); }
.am-node--hi .am-node-shape { fill: var(--hi-fill, var(--accent-bg, #e4ecf8)); stroke: var(--hi-stroke, var(--accent, #1d5fbf)); }
.am-diagram .am-node-text { fill: var(--node-text, var(--ink, #16181d)); }
.am-node--hi text { fill: var(--hi-text, var(--accent, #1d5fbf)); font-weight: 600; }
.am-diagram .am-node--hi .am-node-text { fill: var(--hi-text, var(--accent, #1d5fbf)); }
.am-edge { fill: none; stroke: var(--edge-color, var(--ink-2, #4b5260)); stroke-width: var(--edge-width, 1.3); }
.am-edge--dashed { stroke-dasharray: 5 4; }
.am-arrow { fill: var(--edge-color, var(--ink-2, #4b5260)); }
.am-edge-label rect { fill: var(--paper, #ffffff); }
.am-diagram .am-edge-label text { fill: var(--edge-label, var(--accent, #1d5fbf)); font-size: 11.5px; }
.am-cluster { fill: var(--cluster-fill, var(--fill, #f3f5f8)); stroke: var(--cluster-stroke, var(--line-2, #d6dae1)); stroke-width: 1; stroke-dasharray: 4 3; }
.am-diagram .am-cluster-label { fill: var(--ink-2, #4b5260); font: 11px var(--font-mono, monospace); }
/* The PK / FK / UK marks of an entity follow the node text, and the highlighted text in a highlighted entity, so they stay readable on the theme's fills. */
.am-diagram .am-er-key { fill: var(--node-text, var(--ink-2, #4b5260)); }
.am-diagram .am-node--hi .am-er-key { fill: var(--hi-text, var(--ink-2, #4b5260)); }
.am-lifeline { stroke: var(--lifeline-color, var(--ink-3, #8b929e)); stroke-width: 1; stroke-dasharray: 4 4; }
/* An actor (and the box of a divider) looks like a node unless the theme sets the actor tokens. */
.am-actor { fill: var(--actor-fill, var(--node-fill, var(--paper, #ffffff))); stroke: var(--actor-stroke, var(--node-stroke, var(--line, #1d2026))); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); rx: var(--node-radius, 2px); }
.am-diagram .am-actor-text { fill: var(--actor-text, var(--node-text, var(--ink, #16181d))); }
.am-note { fill: var(--note-fill, var(--warn-bg, #fdf3e2)); stroke: var(--note-stroke, var(--warn, #a8620a)); stroke-width: var(--note-width, 1); rx: var(--note-radius, 2px); }
.am-diagram .am-step { fill: var(--ink-3, #8b929e); font: 10px var(--font-mono, monospace); }


svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#16181d}
</style><defs xmlns="http://www.w3.org/2000/svg"><marker id="diagram-module-interfaces-1-panel-D-1-element-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><line xmlns="http://www.w3.org/2000/svg" class="am-lifeline" x1="54" y1="42" x2="54" y2="620"/><g xmlns="http://www.w3.org/2000/svg" data-key="浏览器"><rect class="am-actor" x="12" y="8" width="84" height="34" rx="2"/><text x="54" y="25" text-anchor="middle" dominant-baseline="central" class="am-actor-text" font-weight="600">浏览器</text></g><line xmlns="http://www.w3.org/2000/svg" class="am-lifeline" x1="244" y1="42" x2="244" y2="620"/><g xmlns="http://www.w3.org/2000/svg" data-key="HTTP"><rect class="am-actor" x="202" y="8" width="84" height="34" rx="2"/><text x="244" y="25" text-anchor="middle" dominant-baseline="central" class="am-actor-text" font-weight="600">HTTP</text></g><line xmlns="http://www.w3.org/2000/svg" class="am-lifeline" x1="392.4" y1="42" x2="392.4" y2="620"/><g xmlns="http://www.w3.org/2000/svg" data-key="RecordService"><rect class="am-actor" x="334.2" y="8" width="116.4" height="34" rx="2"/><text x="392.4" y="25" text-anchor="middle" dominant-baseline="central" class="am-actor-text" font-weight="600">AgentService</text></g><line xmlns="http://www.w3.org/2000/svg" class="am-lifeline" x1="552.2" y1="42" x2="552.2" y2="620"/><g xmlns="http://www.w3.org/2000/svg" data-key="Store"><rect class="am-actor" x="510.2" y="8" width="84" height="34" rx="2"/><text x="552.2" y="25" text-anchor="middle" dominant-baseline="central" class="am-actor-text" font-weight="600">Store</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="0"><text x="149" y="70" text-anchor="middle">GET Run 的 events</text><path class="am-edge" d="M54,80 L242,80" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="60" y="74" text-anchor="start">1</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="1"><text x="318.2" y="110" text-anchor="middle">查询指定 Run 的事件</text><path class="am-edge" d="M244,120 L390.4,120" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="250" y="114" text-anchor="start">2</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="2"><text x="472.3" y="150" text-anchor="middle">按 seq 读取已提交事件</text><path class="am-edge" d="M392.4,160 L550.2,160" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="398.4" y="154" text-anchor="start">3</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="3"><text x="472.3" y="190" text-anchor="middle">顺序事件</text><path class="am-edge am-edge--dashed" d="M552.2,200 L394.4,200" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="546.2" y="194" text-anchor="end">4</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="4"><text x="318.2" y="230" text-anchor="middle">事件批次</text><path class="am-edge am-edge--dashed" d="M392.4,240 L246,240" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="386.4" y="234" text-anchor="end">5</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="5"><text x="149" y="270" text-anchor="middle">SSE progress</text><path class="am-edge am-edge--dashed" d="M244,280 L56,280" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="238" y="274" text-anchor="end">6</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="6"><line class="am-lifeline" x1="12" y1="314" x2="594.2" y2="314"/><rect class="am-actor" x="239.1" y="304" width="128" height="20" rx="2"/><text x="303.1" y="314" text-anchor="middle" dominant-baseline="central" class="am-actor-text" font-size="12">读取到运行结束事件</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="7"><text x="149" y="344" text-anchor="middle">SSE end</text><path class="am-edge am-edge--dashed" d="M244,354 L56,354" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="238" y="348" text-anchor="end">7</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="8"><text x="149" y="384" text-anchor="middle">查询会话历史</text><path class="am-edge" d="M54,394 L242,394" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="60" y="388" text-anchor="start">8</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="9"><text x="318.2" y="424" text-anchor="middle">get_session</text><path class="am-edge" d="M244,434 L390.4,434" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="250" y="428" text-anchor="start">9</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="10"><text x="472.3" y="464" text-anchor="middle">读取持久消息与结果</text><path class="am-edge" d="M392.4,474 L550.2,474" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="398.4" y="468" text-anchor="start">10</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="11"><text x="472.3" y="504" text-anchor="middle">会话记录</text><path class="am-edge am-edge--dashed" d="M552.2,514 L394.4,514" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="546.2" y="508" text-anchor="end">11</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="12"><text x="318.2" y="544" text-anchor="middle">历史与结果</text><path class="am-edge am-edge--dashed" d="M392.4,554 L246,554" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="386.4" y="548" text-anchor="end">12</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="13"><text x="149" y="584" text-anchor="middle">系统结论、证据与模型说明</text><path class="am-edge am-edge--dashed" d="M244,594 L56,594" marker-end="url(#diagram-module-interfaces-1-panel-D-1-element-2)"/><text class="am-step" x="238" y="588" text-anchor="end">13</text></g></svg>
