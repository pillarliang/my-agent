<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 509 434"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
/* Embedded previews can lose html[data-theme]; the fallbacks keep diagrams readable, and defined theme variables still win. */
.am-diagram svg { max-width: 100%; height: auto; font-family: var(--font-sans, sans-serif); }
.am-diagram text { fill: var(--ink, #16181d); font-size: 13px; }
/* Diagram tokens (docs/reference.md, "Diagram tokens"): each painted part reads an optional token and falls back to the look it always had,
   so a theme that sets none of them draws the same diagram. Font family, size and weight are not tokens: diagram text is measured for the sans font. */
.am-node-shape { fill: var(--node-fill, var(--paper, #ffffff)); stroke: var(--node-stroke, var(--line, #1d2026)); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); }
/* A cylinder is two shapes (body, then cap): only the body casts the shadow. */
.am-node-shape ~ .am-node-shape { filter: none; }
/* The corner radius is an SVG attribute (the fallback for Safari before 17.4, which ignores a CSS rx); the default here equals the attribute. A pill and a diamond keep their shape. */
.am-node--rect .am-node-shape, .am-node--er .am-node-shape { rx: var(--node-radius, 3px); }
.am-node--hi .am-node-shape { fill: var(--hi-fill, var(--accent-bg, #e4ecf8)); stroke: var(--hi-stroke, var(--accent, #1d5fbf)); }
.am-diagram .am-node-text { fill: var(--node-text, var(--ink, #16181d)); }
.am-node--hi text { fill: var(--hi-text, var(--accent, #1d5fbf)); font-weight: 600; }
.am-diagram .am-node--hi .am-node-text { fill: var(--hi-text, var(--accent, #1d5fbf)); }
.am-edge { fill: none; stroke: var(--edge-color, var(--ink-2, #4b5260)); stroke-width: var(--edge-width, 1.3); }
.am-edge--dashed { stroke-dasharray: 5 4; }
.am-arrow { fill: var(--edge-color, var(--ink-2, #4b5260)); }
.am-edge-label rect { fill: var(--paper, #ffffff); }
.am-diagram .am-edge-label text { fill: var(--edge-label, var(--accent, #1d5fbf)); font-size: 11.5px; }
.am-cluster { fill: var(--cluster-fill, var(--fill, #f3f5f8)); stroke: var(--cluster-stroke, var(--line-2, #d6dae1)); stroke-width: 1; stroke-dasharray: 4 3; }
.am-diagram .am-cluster-label { fill: var(--ink-2, #4b5260); font: 11px var(--font-mono, monospace); }
/* The PK / FK / UK marks of an entity follow the node text, and the highlighted text in a highlighted entity, so they stay readable on the theme's fills. */
.am-diagram .am-er-key { fill: var(--node-text, var(--ink-2, #4b5260)); }
.am-diagram .am-node--hi .am-er-key { fill: var(--hi-text, var(--ink-2, #4b5260)); }
.am-lifeline { stroke: var(--lifeline-color, var(--ink-3, #8b929e)); stroke-width: 1; stroke-dasharray: 4 4; }
/* An actor (and the box of a divider) looks like a node unless the theme sets the actor tokens. */
.am-actor { fill: var(--actor-fill, var(--node-fill, var(--paper, #ffffff))); stroke: var(--actor-stroke, var(--node-stroke, var(--line, #1d2026))); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); rx: var(--node-radius, 2px); }
.am-diagram .am-actor-text { fill: var(--actor-text, var(--node-text, var(--ink, #16181d))); }
.am-note { fill: var(--note-fill, var(--warn-bg, #fdf3e2)); stroke: var(--note-stroke, var(--warn, #a8620a)); stroke-width: var(--note-width, 1); rx: var(--note-radius, 2px); }
.am-diagram .am-step { fill: var(--ink-3, #8b929e); font: 10px var(--font-mono, monospace); }


svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#16181d}
</style><defs xmlns="http://www.w3.org/2000/svg"><marker id="diagram-stage-5-1-panel-B-1-element-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><line xmlns="http://www.w3.org/2000/svg" class="am-lifeline" x1="54" y1="42" x2="54" y2="430"/><g xmlns="http://www.w3.org/2000/svg" data-key="Harness"><rect class="am-actor" x="12" y="8" width="84" height="34" rx="2"/><text x="54" y="25" text-anchor="middle" dominant-baseline="central" class="am-actor-text" font-weight="600">Harness</text></g><line xmlns="http://www.w3.org/2000/svg" class="am-lifeline" x1="231" y1="42" x2="231" y2="430"/><g xmlns="http://www.w3.org/2000/svg" data-key="状态库"><rect class="am-actor" x="189" y="8" width="84" height="34" rx="2"/><text x="231" y="25" text-anchor="middle" dominant-baseline="central" class="am-actor-text" font-weight="600">状态库</text></g><line xmlns="http://www.w3.org/2000/svg" class="am-lifeline" x1="343" y1="42" x2="343" y2="430"/><g xmlns="http://www.w3.org/2000/svg" data-key="执行器"><rect class="am-actor" x="301" y="8" width="84" height="34" rx="2"/><text x="343" y="25" text-anchor="middle" dominant-baseline="central" class="am-actor-text" font-weight="600">执行器</text></g><line xmlns="http://www.w3.org/2000/svg" class="am-lifeline" x1="455" y1="42" x2="455" y2="430"/><g xmlns="http://www.w3.org/2000/svg" data-key="外部资源"><rect class="am-actor" x="413" y="8" width="84" height="34" rx="2"/><text x="455" y="25" text-anchor="middle" dominant-baseline="central" class="am-actor-text" font-weight="600">外部资源</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="0"><text x="142.5" y="70" text-anchor="middle">保存逻辑动作与幂等键</text><path class="am-edge" d="M54,80 L229,80" marker-end="url(#diagram-stage-5-1-panel-B-1-element-2)"/><text class="am-step" x="60" y="74" text-anchor="start">1</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="1"><text x="198.5" y="110" text-anchor="middle">派发一次尝试</text><path class="am-edge" d="M54,120 L341,120" marker-end="url(#diagram-stage-5-1-panel-B-1-element-2)"/><text class="am-step" x="60" y="114" text-anchor="start">2</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="2"><text x="399" y="150" text-anchor="middle">创建资源</text><path class="am-edge" d="M343,160 L453,160" marker-end="url(#diagram-stage-5-1-panel-B-1-element-2)"/><text class="am-step" x="349" y="154" text-anchor="start">3</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="3"><text x="399" y="190" text-anchor="middle">创建成功</text><path class="am-edge am-edge--dashed" d="M455,200 L345,200" marker-end="url(#diagram-stage-5-1-panel-B-1-element-2)"/><text class="am-step" x="449" y="194" text-anchor="end">4</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="4"><rect class="am-note" x="34" y="224" width="329" height="28" rx="2"/><text x="198.5" y="238" text-anchor="middle" dominant-baseline="central" font-size="12">回执到达前进程或网络中断</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="5"><text x="142.5" y="274" text-anchor="middle">操作结果未知，不能推断失败</text><path class="am-edge" d="M54,284 L229,284" marker-end="url(#diagram-stage-5-1-panel-B-1-element-2)"/><text class="am-step" x="60" y="278" text-anchor="start">5</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="6"><text x="254.5" y="314" text-anchor="middle">查询回执或实际资源</text><path class="am-edge" d="M54,324 L453,324" marker-end="url(#diagram-stage-5-1-panel-B-1-element-2)"/><text class="am-step" x="60" y="318" text-anchor="start">6</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="7"><text x="254.5" y="354" text-anchor="middle">核对结果</text><path class="am-edge am-edge--dashed" d="M455,364 L56,364" marker-end="url(#diagram-stage-5-1-panel-B-1-element-2)"/><text class="am-step" x="449" y="358" text-anchor="end">7</text></g><g xmlns="http://www.w3.org/2000/svg" data-step="8"><text x="142.5" y="394" text-anchor="middle">补充执行记录并决定是否继续</text><path class="am-edge" d="M54,404 L229,404" marker-end="url(#diagram-stage-5-1-panel-B-1-element-2)"/><text class="am-step" x="60" y="398" text-anchor="start">8</text></g></svg>
