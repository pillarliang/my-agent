<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 622" role="img" aria-label="通用协作示例：运行经应用用例进入 Runner；查询读取记录，不触发执行。">
<title>通用协作示例：运行经应用用例进入 Runner；查询读取记录，不触发执行。</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172133;font-size:14px}.life{stroke:#c9d2df;stroke-dasharray:5 5}.arrow{fill:none;stroke:#40516b;stroke-width:1.5}.return{stroke-dasharray:6 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/></marker></defs>
<rect x="45" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="140" y="43" text-anchor="middle">用户入口</text>
<path class="life" d="M140 60 V577"/>
<rect x="285" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="380" y="43" text-anchor="middle">应用用例</text>
<path class="life" d="M380 60 V577"/>
<rect x="525" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="620" y="43" text-anchor="middle">Runner</text>
<path class="life" d="M620 60 V577"/>
<rect x="765" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="860" y="43" text-anchor="middle">记录层</text>
<path class="life" d="M860 60 V577"/>
<text x="260.0" y="88" text-anchor="middle">任务、会话 ID</text>
<text x="260.0" y="106" text-anchor="middle">与运行配置</text>
<path class="arrow" d="M140 118 H380" marker-end="url(#arrow)"/>
<text x="500.0" y="170" text-anchor="middle">开始一次任务</text>
<path class="arrow" d="M380 182 H620" marker-end="url(#arrow)"/>
<text x="740.0" y="234" text-anchor="middle">提交消息、回执与最终状态</text>
<path class="arrow" d="M620 246 H860" marker-end="url(#arrow)"/>
<text x="740.0" y="298" text-anchor="middle">提交结果或存储错误</text>
<path class="arrow return" d="M860 310 H620" marker-end="url(#arrow)"/>
<text x="500.0" y="362" text-anchor="middle">运行结果或停止原因</text>
<path class="arrow return" d="M620 374 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="426" text-anchor="middle">展示结果或报告失败</text>
<path class="arrow return" d="M380 438 H140" marker-end="url(#arrow)"/>
<text x="500.0" y="490" text-anchor="middle">只读查询历史（另一条调用路径）</text>
<path class="arrow" d="M140 502 H860" marker-end="url(#arrow)"/>
<text x="500.0" y="554" text-anchor="middle">已有记录或查询错误</text>
<path class="arrow return" d="M860 566 H140" marker-end="url(#arrow)"/>
<text x="500.0" y="610" text-anchor="middle">实线：发起调用或提交；虚线：返回结果或失败。角色表示职责，不限定具体类。</text></svg>
