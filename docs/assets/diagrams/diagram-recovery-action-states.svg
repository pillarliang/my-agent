<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 980 540"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
.am-diagram svg { max-width: 100%; height: auto; font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif); }
.am-diagram text { fill: var(--ink, #16181d); font-size: 12.5px; }
.am-state-shape { fill: var(--paper, #ffffff); stroke: var(--line, #1d2026); stroke-width: 1.5; rx: 8px; }
.am-edge { fill: none; stroke: var(--edge-color, var(--ink-2, #4b5260)); stroke-width: 1.4; }
.am-edge--crash { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 5 3; }
.am-edge--probe { stroke: #ea580c; stroke-width: 1.5; }
.am-edge--success { stroke: #16a34a; stroke-width: 1.5; }
.am-edge--reset { stroke: #2563eb; stroke-width: 1.5; }
.am-edge--danger { stroke: #dc2626; stroke-width: 1.5; }
.am-arrow { fill: var(--edge-color, var(--ink-2, #4b5260)); }
.am-arrow--crash { fill: #dc2626; }
.am-arrow--probe { fill: #ea580c; }
.am-arrow--success { fill: #16a34a; }
.am-arrow--reset { fill: #2563eb; }
.am-arrow--danger { fill: #dc2626; }
.am-edge-tag rect { fill: var(--paper, #ffffff); stroke: #cbd5e1; stroke-width: 1; rx: 3px; }
.am-edge-tag text { font-size: 11px; fill: #334155; }
.am-edge-tag--crash rect { fill: #fef2f2; stroke: #fca5a5; }
.am-edge-tag--crash text { fill: #b91c1c; font-weight: 600; }
.am-edge-tag--success rect { fill: #f0fdf4; stroke: #86efac; }
.am-edge-tag--success text { fill: #15803d; font-weight: 600; }
.am-edge-tag--reset rect { fill: #eff6ff; stroke: #93c5fd; }
.am-edge-tag--reset text { fill: #1d4ed8; font-weight: 600; }
.am-edge-tag--danger rect { fill: #fff1f2; stroke: #fda4af; }
.am-edge-tag--danger text { fill: #be123c; font-weight: 600; }
.am-state-title { font-weight: 700; font-size: 13px; }
.am-state-desc { font-size: 11px; fill: #64748b; }
.am-choice { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-crash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow--crash" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-probe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow--probe" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow--success" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-reset" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow--reset" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow--danger" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<!-- ==================== 顶部标题与背景框 ==================== -->
<text x="490" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">动作执行生命周期与恢复核查状态机 (Action State Machine)</text>

<!-- ==================== 状态节点定义 ==================== -->

<!-- 1. 初态 (Initial State: 实心圆) -->
<circle cx="45" cy="85" r="11" fill="#1e293b"/>
<text x="45" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">初态</text>

<!-- 2. 状态：not_dispatched -->
<g transform="translate(100, 50)">
  <rect class="am-state-shape" width="185" height="70" stroke="#3b82f6" fill="#f8faff"/>
  <line x1="0" y1="28" x2="185" y2="28" stroke="#dbeafe" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4" fill="#3b82f6"/>
  <text x="26" y="18" class="am-state-title" fill="#1d4ed8">not_dispatched</text>
  <text x="16" y="44" class="am-state-desc">尚未派发 · 底层动作从未执行</text>
  <text x="16" y="60" class="am-state-desc">外部物理世界零残留、零污染</text>
</g>

<!-- 3. 状态：running -->
<g transform="translate(390, 50)">
  <rect class="am-state-shape" width="185" height="70" stroke="#9333ea" fill="#faf5ff"/>
  <line x1="0" y1="28" x2="185" y2="28" stroke="#f3e8ff" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4" fill="#9333ea"/>
  <text x="26" y="18" class="am-state-title" fill="#7e22ce">running</text>
  <text x="16" y="44" class="am-state-desc">正在执行 / 后台异步运行中</text>
  <text x="16" y="60" class="am-state-desc">底层进程活跃 · 等待返回回执</text>
</g>

<!-- 4. 状态：completed (终态之一) -->
<g transform="translate(685, 50)">
  <rect class="am-state-shape" width="185" height="70" stroke="#16a34a" fill="#f0fdf4"/>
  <line x1="0" y1="28" x2="185" y2="28" stroke="#dcfce7" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4" fill="#16a34a"/>
  <text x="26" y="18" class="am-state-title" fill="#15803d">completed</text>
  <text x="16" y="44" class="am-state-desc">已确认完成 · 物理回执完备</text>
  <text x="16" y="60" class="am-state-desc">直接复用结果 · 跳过物理重做</text>
</g>

<!-- 5. 终态 (Final State: 双同心圆) -->
<circle cx="940" cy="85" r="13" fill="none" stroke="#0f172a" stroke-width="1.5"/>
<circle cx="940" cy="85" r="8" fill="#0f172a"/>
<text x="940" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">终态</text>

<!-- 6. 异常状态：unknown (极高危临界断点) -->
<g transform="translate(380, 200)">
  <rect class="am-state-shape" width="205" height="78" stroke="#e11d48" stroke-width="1.8" fill="#fff1f2"/>
  <line x1="0" y1="28" x2="205" y2="28" stroke="#ffe4e6" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4" fill="#e11d48"/>
  <text x="26" y="18" class="am-state-title" fill="#be123c">unknown (极高危未知态)</text>
  <text x="14" y="45" class="am-state-desc" fill="#e11d48" font-weight="600">⚠ 中途中断 · 物理状态未决！</text>
  <text x="14" y="63" class="am-state-desc">严禁自动重做！等待物证探查</text>
</g>

<!-- 7. 判定节点：Evidence Probe 物证探查 (Choice 菱形) -->
<g transform="translate(482, 335)">
  <polygon class="am-choice" points="0,-22 36,0 0,22 -36,0"/>
  <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">探查</text>
</g>
<text x="482" y="372" text-anchor="middle" font-size="11" font-weight="600" fill="#ea580c">Evidence Probe 物证核验</text>

<!-- 8. 挂起状态：paused_for_human (终态之一) -->
<g transform="translate(365, 435)">
  <rect class="am-state-shape" width="235" height="68" stroke="#d97706" fill="#fffbeb"/>
  <line x1="0" y1="28" x2="235" y2="28" stroke="#fef3c7" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4" fill="#d97706"/>
  <text x="26" y="18" class="am-state-title" fill="#b45309">paused_for_human</text>
  <text x="16" y="44" class="am-state-desc">人工介入挂起 · 状态机熔断锁定</text>
  <text x="16" y="58" class="am-state-desc">等待人工排查物理环境并确认</text>
</g>

<!-- ==================== 状态转移连线与转换事件 ==================== -->

<!-- 转移 1: 初态 -> not_dispatched -->
<path class="am-edge" d="M56,85 H98" marker-end="url(#arrow)"/>
<g class="am-edge-tag" transform="translate(58, 62)"><rect width="36" height="16"/><text x="18" y="11" text-anchor="middle">创建</text></g>

<!-- 转移 2: not_dispatched -> running (正常派发) -->
<path class="am-edge" d="M285,75 H388" marker-end="url(#arrow)"/>
<g class="am-edge-tag" transform="translate(295, 55)"><rect width="84" height="18"/><text x="42" y="12" text-anchor="middle">[Policy获准]/派发</text></g>

<!-- 转移 3: running -> completed (正常成功) -->
<path class="am-edge" d="M575,75 H683" marker-end="url(#arrow)"/>
<g class="am-edge-tag" transform="translate(588, 55)"><rect width="84" height="18"/><text x="42" y="12" text-anchor="middle">执行成功/回执落盘</text></g>

<!-- 转移 4: completed -> 终态 -->
<path class="am-edge" d="M870,85 H925" marker-end="url(#arrow)"/>
<g class="am-edge-tag" transform="translate(876, 62)"><rect width="42" height="16"/><text x="21" y="11" text-anchor="middle">推下轮</text></g>

<!-- 转移 5: running -> unknown (猝死中断跃迁) -->
<path class="am-edge--crash" d="M482,120 V198" marker-end="url(#arrow-crash)"/>
<g class="am-edge-tag--crash" transform="translate(488, 142)">
  <rect width="138" height="22"/>
  <text x="69" y="14" text-anchor="middle">系统猝死 (OOM / SIGKILL)</text>
</g>

<!-- 转移 6: unknown -> Evidence Probe 判定节点 -->
<path class="am-edge--probe" d="M482,278 V311" marker-end="url(#arrow-probe)"/>
<g class="am-edge-tag" transform="translate(488, 282)"><rect width="70" height="18"/><text x="35" y="12" text-anchor="middle">冷启动恢复</text></g>

<!-- 转移 7 (分支 A): Evidence Probe -> completed (物证匹配，合成回执复用) -->
<!-- 从 (518, 335) 向右上方折线连接到 completed (777, 120) -->
<path class="am-edge--success" d="M518,335 H777 V122" marker-end="url(#arrow-success)"/>
<g class="am-edge-tag--success" transform="translate(545, 318)">
  <rect width="210" height="22"/>
  <text x="105" y="14" text-anchor="middle">[A. 物证匹配：文件存在且哈希一致] / 合成回执</text>
</g>

<!-- 转移 8 (分支 B): Evidence Probe -> not_dispatched (物证确认未发生，重审派发) -->
<!-- 从 (446, 335) 向左上方折线连接到 not_dispatched (192, 120) -->
<path class="am-edge--reset" d="M446,335 H192 V122" marker-end="url(#arrow-reset)"/>
<g class="am-edge-tag--reset" transform="translate(208, 318)">
  <rect width="215" height="22"/>
  <text x="107" y="14" text-anchor="middle">[B. 确认未发生：物理零污染] / 重置为待派发</text>
</g>

<!-- 转移 9 (分支 C): Evidence Probe -> paused_for_human (物证冲突/无法确定，熔断挂起) -->
<path class="am-edge--danger" d="M482,357 V433" marker-end="url(#arrow-danger)"/>
<g class="am-edge-tag--danger" transform="translate(488, 390)">
  <rect width="180" height="22"/>
  <text x="90" y="14" text-anchor="middle">[C. 物证冲突或无法确定] / 熔断挂起</text>
</g>

<!-- 转移 10: running 在重启后的恢复自愈 (重连异步任务句柄) -->
<path class="am-edge" stroke-dasharray="4 3" d="M575,95 C630,115 630,135 575,108"/>
<text x="618" y="112" font-size="10" fill="#7e22ce">[恢复续接] 重挂句柄</text>

<!-- 转移 11: not_dispatched 动态重审自愈线 (二次鉴权) -->
<path class="am-edge" stroke-dasharray="4 3" d="M285,100 C340,118 340,135 285,110"/>
<text x="328" y="122" font-size="10" fill="#1d4ed8">[动态重审] 最新Policy</text>

</svg>
