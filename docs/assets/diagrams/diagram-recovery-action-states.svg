<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 900 520"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
/* Embedded previews can lose html[data-theme]; the fallbacks keep diagrams readable, and defined theme variables still win. */
.am-diagram svg { max-width: 100%; height: auto; font-family: var(--font-sans, sans-serif); }
.am-diagram text { fill: var(--ink, #16181d); font-size: 13px; }
/* Diagram tokens (docs/reference.md, "Diagram tokens"): each painted part reads an optional token and falls back to the look it always had,
   so a theme that sets none of them draws the same diagram. Font family, size and weight are not tokens: diagram text is measured for the sans font. */
.am-node-shape { fill: var(--node-fill, var(--paper, #ffffff)); stroke: var(--node-stroke, var(--line, #1d2026)); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); }
.am-node-shape ~ .am-node-shape { filter: none; }
.am-node--rect .am-node-shape, .am-node--er .am-node-shape { rx: var(--node-radius, 3px); }
.am-node--hi .am-node-shape { fill: var(--hi-fill, var(--accent-bg, #e4ecf8)); stroke: var(--hi-stroke, var(--accent, #1d5fbf)); }
.am-diagram .am-node-text { fill: var(--node-text, var(--ink, #16181d)); font-size: 12.5px; }
.am-node--hi text { fill: var(--hi-text, var(--accent, #1d5fbf)); font-weight: 600; }
.am-diagram .am-node--hi .am-node-text { fill: var(--hi-text, var(--accent, #1d5fbf)); font-weight: 600; }
.am-edge { fill: none; stroke: var(--edge-color, var(--ink-2, #4b5260)); stroke-width: var(--edge-width, 1.3); }
.am-edge--dashed { stroke-dasharray: 5 4; }
.am-arrow { fill: var(--edge-color, var(--ink-2, #4b5260)); }
.am-edge-label rect { fill: var(--paper, #ffffff); }
.am-diagram .am-edge-label text { fill: var(--edge-label, var(--accent, #1d5fbf)); font-size: 11.5px; }
.am-cluster { fill: var(--cluster-fill, var(--fill, #f3f5f8)); stroke: var(--cluster-stroke, var(--line-2, #d6dae1)); stroke-width: 1; stroke-dasharray: 4 3; rx: 4px; }
.am-diagram .am-cluster-label { fill: var(--ink-2, #4b5260); font: 11px var(--font-mono, monospace); }
.am-lifeline { stroke: var(--lifeline-color, var(--ink-3, #8b929e)); stroke-width: 1; stroke-dasharray: 4 4; }
.am-actor { fill: var(--actor-fill, var(--node-fill, var(--paper, #ffffff))); stroke: var(--actor-stroke, var(--node-stroke, var(--line, #1d2026))); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); rx: var(--node-radius, 2px); }
.am-diagram .am-actor-text { fill: var(--actor-text, var(--node-text, var(--ink, #16181d))); }
.am-note { fill: var(--note-fill, var(--warn-bg, #fdf3e2)); stroke: var(--note-stroke, var(--warn, #a8620a)); stroke-width: 1; rx: var(--node-radius, 2px); }
.am-diagram .am-step { fill: var(--ink-3, #8b929e); font: 10px var(--font-mono, monospace); }

svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#16181d}
</style>
<defs><marker id="action-state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>

<!-- ==================== 状态转移有向线与标签层 ==================== -->
<g>
  <!-- 1. 起始 -> not_dispatched -->
  <path class="am-edge" d="M64,80 H105" marker-end="url(#action-state-arrow)"/>
  <g class="am-edge-label"><rect x="66" y="71" width="36" height="18" rx="3"/><text x="84" y="80" text-anchor="middle" dominant-baseline="central">调用</text></g>

  <!-- 2. not_dispatched -> running -->
  <path class="am-edge" d="M290,80 H360" marker-end="url(#action-state-arrow)"/>
  <g class="am-edge-label"><rect x="294" y="71" width="62" height="18" rx="3"/><text x="325" y="80" text-anchor="middle" dominant-baseline="central">[获准]/派发</text></g>

  <!-- 3. running -> completed -->
  <path class="am-edge" d="M540,80 H610" marker-end="url(#action-state-arrow)"/>
  <g class="am-edge-label"><rect x="545" y="71" width="60" height="18" rx="3"/><text x="575" y="80" text-anchor="middle" dominant-baseline="central">成功/落盘</text></g>

  <!-- 4. completed -> 正常结束 -->
  <path class="am-edge" d="M795,80 H841" marker-end="url(#action-state-arrow)"/>
  <g class="am-edge-label"><rect x="800" y="71" width="38" height="18" rx="3"/><text x="819" y="80" text-anchor="middle" dominant-baseline="central">闭合</text></g>

  <!-- 5. running -> unknown (系统猝死中断异常跃迁) -->
  <path class="am-edge am-edge--dashed" d="M450,108 V185" marker-end="url(#action-state-arrow)"/>
  <g class="am-edge-label"><rect x="375" y="137" width="150" height="18" rx="3"/><text x="450" y="146" text-anchor="middle" dominant-baseline="central">⚡ 系统猝死 (OOM / SIGKILL)</text></g>

  <!-- 6. unknown -> 物证探查判定网关 -->
  <path class="am-edge" d="M450,243 V295" marker-end="url(#action-state-arrow)"/>
  <g class="am-edge-label"><rect x="382" y="259" width="136" height="18" rx="3"/><text x="450" y="268" text-anchor="middle" dominant-baseline="central">冷启动恢复 (resume_task)</text></g>

  <!-- 7. 判定 -> 分支 A (物证匹配 -> completed) -->
  <path class="am-edge" d="M530,320 H702 V108" marker-end="url(#action-state-arrow)"/>
  <g class="am-edge-label"><rect x="546" y="311" width="224" height="18" rx="3"/><text x="658" y="320" text-anchor="middle" dominant-baseline="central">[A. 物证匹配：哈希一致] / 合成回执落盘</text></g>

  <!-- 8. 判定 -> 分支 B (确认未发生 -> not_dispatched) -->
  <path class="am-edge" d="M370,320 H197 V108" marker-end="url(#action-state-arrow)"/>
  <g class="am-edge-label"><rect x="175" y="311" width="186" height="18" rx="3"/><text x="268" y="320" text-anchor="middle" dominant-baseline="central">[B. 确认未发生：物理零污染] / 重置</text></g>

  <!-- 9. 判定 -> 分支 C (物证冲突/无法查明 -> paused_for_human) -->
  <path class="am-edge am-edge--dashed" d="M450,345 V410" marker-end="url(#action-state-arrow)"/>
  <g class="am-edge-label"><rect x="350" y="367" width="200" height="18" rx="3"/><text x="450" y="376" text-anchor="middle" dominant-baseline="central">[C. 物证冲突或状态无法查明] / 熔断</text></g>

  <!-- 10. paused_for_human -> 异常挂起结束 -->
  <path class="am-edge" d="M450,464 V480" marker-end="url(#action-state-arrow)"/>
</g>

<!-- ==================== 状态节点与起止标记层 ==================== -->
<g>
  <!-- 起始环节：Initial Pseudo-state -->
  <circle cx="55" cy="80" r="9" fill="var(--ink, #16181d)"/>
  <text x="55" y="104" text-anchor="middle" font-size="11" fill="var(--ink-2, #4b5260)">起始</text>

  <!-- 状态 1：not_dispatched -->
  <g class="am-node am-node--rect">
    <rect class="am-node-shape" x="105" y="52" width="185" height="56" rx="3"/>
    <text x="197" y="71" text-anchor="middle" dominant-baseline="central" class="am-node-text" font-weight="600">not_dispatched</text>
    <text x="197" y="90" text-anchor="middle" dominant-baseline="central" class="am-node-text" font-size="11" fill="var(--ink-2, #4b5260)">尚未派发 · 外部物理零污染</text>
  </g>

  <!-- 状态 2：running -->
  <g class="am-node am-node--rect am-node--hi">
    <rect class="am-node-shape" x="360" y="52" width="180" height="56" rx="3"/>
    <text x="450" y="71" text-anchor="middle" dominant-baseline="central" class="am-node-text">running</text>
    <text x="450" y="90" text-anchor="middle" dominant-baseline="central" class="am-node-text" font-size="11">执行中 · 进程等待真实回执</text>
  </g>

  <!-- 状态 3：completed (正常终态前置状态) -->
  <g class="am-node am-node--rect am-node--hi">
    <rect class="am-node-shape" x="610" y="52" width="185" height="56" rx="3"/>
    <text x="702" y="71" text-anchor="middle" dominant-baseline="central" class="am-node-text">completed</text>
    <text x="702" y="90" text-anchor="middle" dominant-baseline="central" class="am-node-text" font-size="11">已确认完成 · 直接复用跳过重做</text>
  </g>

  <!-- 正常结束环节：Final State (双同心圆) -->
  <circle cx="855" cy="80" r="13" fill="none" stroke="var(--ink, #16181d)" stroke-width="1.5"/>
  <circle cx="855" cy="80" r="7" fill="var(--ink, #16181d)"/>
  <text x="855" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink, #16181d)">正常结束</text>
  <text x="855" y="60" text-anchor="middle" font-size="10.5" fill="var(--accent, #1d5fbf)">推进下一轮</text>

  <!-- 状态 4：unknown (极高危未知断点) -->
  <g class="am-node am-node--rect">
    <rect class="am-node-shape" x="330" y="185" width="240" height="58" rx="3" stroke="var(--err, #ff7070)" stroke-width="1.6"/>
    <text x="450" y="204" text-anchor="middle" dominant-baseline="central" class="am-node-text" font-weight="650" fill="var(--err, #ff7070)">unknown (极高危未知态)</text>
    <text x="450" y="225" text-anchor="middle" dominant-baseline="central" class="am-node-text" font-size="11" fill="var(--ink-2, #4b5260)">⚠ 猝死中断 · 物理状态未决！严禁重试</text>
  </g>

  <!-- 判定网关：物证探查 (Choice 菱形) -->
  <g class="am-node am-node--diamond">
    <polygon class="am-node-shape" points="450,295 530,320 450,345 370,320"/>
    <text x="450" y="320" text-anchor="middle" dominant-baseline="central" class="am-node-text" font-weight="600">物证探查结果?</text>
  </g>

  <!-- 状态 5：paused_for_human (人工介入挂起状态) -->
  <g class="am-node am-node--rect">
    <rect class="am-node-shape" x="320" y="410" width="260" height="54" rx="3" stroke="var(--warn, #f0b14a)" stroke-width="1.5"/>
    <text x="450" y="428" text-anchor="middle" dominant-baseline="central" class="am-node-text" font-weight="600" fill="var(--warn, #a8620a)">paused_for_human (人工挂起)</text>
    <text x="450" y="447" text-anchor="middle" dominant-baseline="central" class="am-node-text" font-size="11" fill="var(--ink-2, #4b5260)">状态机熔断锁定 · 等待人工排查确认</text>
  </g>

  <!-- 挂起结束环节：Final State (双同心圆) -->
  <circle cx="450" cy="493" r="11" fill="none" stroke="var(--warn, #a8620a)" stroke-width="1.5"/>
  <circle cx="450" cy="493" r="5" fill="var(--warn, #a8620a)"/>
  <text x="525" y="493" dominant-baseline="central" font-size="11" font-weight="600" fill="var(--warn, #a8620a)">挂起结束 (等待人工介入)</text>
</g>
</svg>
