<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 980 540" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
.am-diagram svg { max-width: 100%; height: auto; }
</style>
<defs>
  <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#64748b"/></marker>
  <marker id="arrow-crash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/></marker>
  <marker id="arrow-probe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ea580c"/></marker>
  <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#16a34a"/></marker>
  <marker id="arrow-reset" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/></marker>
</defs>

<!-- 顶部图表标题栏 -->
<rect x="290" y="10" width="400" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="490" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" dominant-baseline="central">动作四态与物证核查标准状态机 (UML State Machine)</text>

<!-- ==================== 状态节点定义 ==================== -->

<!-- 1. 初态 (Initial State: 优雅的双环微标) -->
<circle cx="45" cy="85" r="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="45" cy="85" r="7" fill="#2563eb"/>
<text x="45" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">初态</text>

<!-- 2. 状态：not_dispatched -->
<g transform="translate(105, 50)">
  <rect width="180" height="70" rx="8" fill="#f0f7ff" stroke="#3b82f6" stroke-width="1.6"/>
  <line x1="0" y1="28" x2="180" y2="28" stroke="#bfdbfe" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4.5" fill="#3b82f6"/>
  <text x="27" y="18" font-size="13" font-weight="700" fill="#1d4ed8">not_dispatched</text>
  <text x="14" y="44" font-size="11" fill="#475569">尚未派发 · 底层动作从未执行</text>
  <text x="14" y="60" font-size="11" fill="#64748b">外部物理世界零残留、零污染</text>
</g>

<!-- 3. 状态：running -->
<g transform="translate(390, 50)">
  <rect width="180" height="70" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <line x1="0" y1="28" x2="180" y2="28" stroke="#e9d5ff" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4.5" fill="#9333ea"/>
  <text x="27" y="18" font-size="13" font-weight="700" fill="#7e22ce">running</text>
  <text x="14" y="44" font-size="11" fill="#475569">正在执行 / 后台异步运行中</text>
  <text x="14" y="60" font-size="11" fill="#64748b">底层进程活跃 · 等待返回回执</text>
</g>

<!-- 4. 状态：completed (成功终态) -->
<g transform="translate(675, 50)">
  <rect width="180" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <line x1="0" y1="28" x2="180" y2="28" stroke="#bbf7d0" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4.5" fill="#16a34a"/>
  <text x="27" y="18" font-size="13" font-weight="700" fill="#15803d">completed</text>
  <text x="14" y="44" font-size="11" fill="#475569">已确认完成 · 物理回执完备</text>
  <text x="14" y="60" font-size="11" fill="#64748b">直接复用结果 · 跳过物理重做</text>
</g>

<!-- 5. 终态 (Final State: 绿色同心环) -->
<circle cx="925" cy="85" r="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="925" cy="85" r="7" fill="#16a34a"/>
<text x="925" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">终态</text>

<!-- 6. 异常状态：unknown (极高危临界断点) -->
<g transform="translate(375, 195)">
  <rect width="210" height="78" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="0" y1="28" x2="210" y2="28" stroke="#fecdd3" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4.5" fill="#e11d48"/>
  <text x="27" y="18" font-size="13" font-weight="700" fill="#be123c">unknown (极高危未知态)</text>
  <text x="14" y="45" font-size="11" font-weight="700" fill="#e11d48">⚠ 中途中断 · 物理状态未决！</text>
  <text x="14" y="63" font-size="11" fill="#64748b">严禁自动重做！等待物证探查</text>
</g>

<!-- 7. 判定节点：Evidence Probe 物证探查 (Choice 菱形) -->
<g transform="translate(480, 335)">
  <polygon points="0,-24 40,0 0,24 -40,0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">核验</text>
</g>
<text x="480" y="372" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ea580c">Evidence Probe 物证探查器</text>

<!-- 8. 挂起状态：paused_for_human (终态之一) -->
<g transform="translate(360, 435)">
  <rect width="240" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <line x1="0" y1="28" x2="240" y2="28" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="16" cy="14" r="4.5" fill="#d97706"/>
  <text x="27" y="18" font-size="13" font-weight="700" fill="#b45309">paused_for_human</text>
  <text x="14" y="44" font-size="11" fill="#475569">人工介入挂起 · 状态机熔断锁定</text>
  <text x="14" y="60" font-size="11" fill="#64748b">等待排查物理环境后由人工恢复</text>
</g>

<!-- ==================== 状态转移连线与转换事件 ==================== -->

<!-- 转移 1: 初态 -> not_dispatched -->
<path d="M59,85 H103" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-default)"/>
<g transform="translate(63, 64)">
  <rect width="36" height="17" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="18" y="12" text-anchor="middle" font-size="10.5" fill="#334155">接收</text>
</g>

<!-- 转移 2: not_dispatched -> running (正常派发) -->
<path d="M285,75 H388" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-default)"/>
<g transform="translate(295, 55)">
  <rect width="84" height="19" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="13" text-anchor="middle" font-size="10.5" fill="#334155">[Policy获准]/派发</text>
</g>

<!-- 转移 3: running -> completed (正常成功) -->
<path d="M570,75 H673" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-default)"/>
<g transform="translate(580, 55)">
  <rect width="84" height="19" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="13" text-anchor="middle" font-size="10.5" fill="#334155">执行成功/落盘</text>
</g>

<!-- 转移 4: completed -> 终态 -->
<path d="M855,85 H909" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-default)"/>
<g transform="translate(861, 64)">
  <rect width="42" height="17" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="21" y="12" text-anchor="middle" font-size="10.5" fill="#334155">推下轮</text>
</g>

<!-- 转移 5: running -> unknown (猝死中断跃迁) -->
<path d="M480,120 V193" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-crash)"/>
<g transform="translate(488, 144)">
  <rect width="145" height="22" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="72" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">系统猝死 (OOM/SIGKILL)</text>
</g>

<!-- 转移 6: unknown -> Evidence Probe 判定节点 -->
<path d="M480,273 V309" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-probe)"/>
<g transform="translate(488, 280)">
  <rect width="76" height="19" rx="3" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="38" y="13" text-anchor="middle" font-size="11" font-weight="600" fill="#c2410c">冷启动恢复</text>
</g>

<!-- 转移 7 (分支 A): Evidence Probe -> completed (物证匹配，合成回执复用) -->
<path d="M520,335 H765 V122" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-success)"/>
<g transform="translate(545, 318)">
  <rect width="215" height="23" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="107" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">[A. 物证匹配：文件存在且哈希一致] / 合成回执</text>
</g>

<!-- 转移 8 (分支 B): Evidence Probe -> not_dispatched (物证确认未发生，重审派发) -->
<path d="M440,335 H195 V122" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-reset)"/>
<g transform="translate(208, 318)">
  <rect width="220" height="23" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">[B. 确认未发生：物理零污染] / 重置为待派发</text>
</g>

<!-- 转移 9 (分支 C): Evidence Probe -> paused_for_human (物证冲突/无法确定，熔断挂起) -->
<path d="M480,359 V433" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-danger)"/>
<g transform="translate(488, 390)">
  <rect width="185" height="23" rx="3" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
  <text x="92" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">[C. 物证冲突或无法确定] / 熔断挂起</text>
</g>

<!-- 转移 10: running 在重启后的恢复自愈 (重连异步任务句柄) -->
<path d="M570,95 C625,115 625,135 570,108" fill="none" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="615" y="112" font-size="10.5" fill="#7e22ce">[恢复续接] 重挂句柄</text>

<!-- 转移 11: not_dispatched 动态重审自愈线 (二次鉴权) -->
<path d="M285,98 C335,118 335,135 285,110" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="325" y="122" font-size="10.5" fill="#1d4ed8">[动态重审] 最新Policy</text>

</svg>
