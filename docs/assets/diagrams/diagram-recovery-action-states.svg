<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 700 480"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
/* Embedded previews can lose html[data-theme]; the fallbacks keep diagrams readable, and defined theme variables still win. */
.am-diagram svg { max-width: 100%; height: auto; font-family: var(--font-sans, sans-serif); }
.am-diagram text { fill: var(--ink, #16181d); font-size: 13px; }
/* Diagram tokens (docs/reference.md, "Diagram tokens"): each painted part reads an optional token and falls back to the look it always had,
   so a theme that sets none of them draws the same diagram. Font family, size and weight are not tokens: diagram text is measured for the sans font. */
.am-node-shape { fill: var(--node-fill, var(--paper, #ffffff)); stroke: var(--node-stroke, var(--line, #1d2026)); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); }
.am-node-shape ~ .am-node-shape { filter: none; }
.am-node--rect .am-node-shape, .am-node--er .am-node-shape { rx: var(--node-radius, 3px); }
.am-node--hi .am-node-shape { fill: var(--hi-fill, var(--accent-bg, #e4ecf8)); stroke: var(--hi-stroke, var(--accent, #1d5fbf)); }
.am-diagram .am-node-text { fill: var(--node-text, var(--ink, #16181d)); }
.am-node--hi text { fill: var(--hi-text, var(--accent, #1d5fbf)); font-weight: 600; }
.am-diagram .am-node--hi .am-node-text { fill: var(--hi-text, var(--accent, #1d5fbf)); }
.am-edge { fill: none; stroke: var(--edge-color, var(--ink-2, #4b5260)); stroke-width: var(--edge-width, 1.3); }
.am-edge--dashed { stroke-dasharray: 5 4; }
.am-arrow { fill: var(--edge-color, var(--ink-2, #4b5260)); }
.am-edge-label rect { fill: var(--paper, #ffffff); }
.am-diagram .am-edge-label text { fill: var(--edge-label, var(--accent, #1d5fbf)); font-size: 11.5px; }
.am-cluster { fill: var(--cluster-fill, var(--fill, #f3f5f8)); stroke: var(--cluster-stroke, var(--line-2, #d6dae1)); stroke-width: 1; stroke-dasharray: 4 3; }
.am-diagram .am-cluster-label { fill: var(--ink-2, #4b5260); font: 11px var(--font-mono, monospace); }
.am-lifeline { stroke: var(--lifeline-color, var(--ink-3, #8b929e)); stroke-width: 1; stroke-dasharray: 4 4; }
.am-actor { fill: var(--actor-fill, var(--node-fill, var(--paper, #ffffff))); stroke: var(--actor-stroke, var(--node-stroke, var(--line, #1d2026))); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); rx: var(--node-radius, 2px); }
.am-diagram .am-actor-text { fill: var(--actor-text, var(--node-text, var(--ink, #16181d))); }
.am-note { fill: var(--note-fill, var(--warn-bg, #fdf3e2)); stroke: var(--note-stroke, var(--warn, #a8620a)); stroke-width: 1; rx: var(--node-radius, 2px); }
.am-diagram .am-step { fill: var(--ink-3, #8b929e); font: 10px var(--font-mono, monospace); }

svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#16181d}
</style>
<defs><marker id="recovery-loop-interface-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>

<!-- 角色垂直生命线 -->
<line class="am-lifeline" x1="160" y1="66" x2="160" y2="430"/>
<line class="am-lifeline" x1="540" y1="66" x2="540" y2="430"/>

<!-- 顶部两方实体卡片 -->
<g><rect class="am-actor" x="40" y="20" width="240" height="46" rx="3"/><text class="am-actor-text" x="160" y="43" text-anchor="middle" dominant-baseline="central">Agent Loop（Runner / 恢复入口）</text></g>
<g><rect class="am-actor" x="420" y="20" width="240" height="46" rx="3"/><text class="am-actor-text" x="540" y="43" text-anchor="middle" dominant-baseline="central">Recovery / Checkpoint 系统</text></g>

<!-- 步骤 1：运行期动作登记与切点落盘 -->
<g><text x="350" y="98" text-anchor="middle">登记待执行动作（register_invocation: 幂等键、参数）</text><path class="am-edge" d="M160,111 H538" marker-end="url(#recovery-loop-interface-arrow)"/></g>
<g><text x="350" y="142" text-anchor="middle">持久化检查点切点（status 标记为 unknown）</text><path class="am-edge am-edge--dashed" d="M540,155 H162" marker-end="url(#recovery-loop-interface-arrow)"/></g>

<!-- 中途崩溃分割线 -->
<line class="am-edge am-edge--dashed" x1="80" y1="182" x2="620" y2="182" stroke-dasharray="4 3"/>
<text x="350" y="177" text-anchor="middle" font-size="11.5" fill="var(--warn, #a8620a)">⚡ 进程在操作中途遭遇 OOM / 断电猝死 · 内存清空 · 磁盘保留 Checkpoint ⚡</text>

<!-- 步骤 2：冷启动专用入口拉起恢复 -->
<g><text x="350" y="212" text-anchor="middle">独立恢复入口启动任务（resume_task(run_id)）</text><path class="am-edge" d="M160,225 H538" marker-end="url(#recovery-loop-interface-arrow)"/></g>
<g><text x="350" y="254" text-anchor="middle">加载执行锚点与未闭合动作清单（Invocations 列表）</text><path class="am-edge am-edge--dashed" d="M540,267 H162" marker-end="url(#recovery-loop-interface-arrow)"/></g>

<!-- 步骤 3：四态核验与物证探查（分组框） -->
<rect class="am-actor" x="70" y="285" width="560" height="96" rx="3" fill="none" style="fill:none"/>
<text x="85" y="303" font-size="11.5" font-weight="600">未闭合调用按四态严格分流（严禁二元“成功/失败”）</text>
<g><text x="350" y="325" text-anchor="middle">触发外部物证探查器（Evidence Probe: 校验目标存在与哈希）</text><path class="am-edge" d="M160,338 H538" marker-end="url(#recovery-loop-interface-arrow)"/></g>
<g><text x="350" y="362" text-anchor="middle">物证匹配已生效 ➔ 合成回执转 completed，补齐 Session 记录</text><path class="am-edge am-edge--dashed" d="M540,375 H162" marker-end="url(#recovery-loop-interface-arrow)"/></g>

<!-- 步骤 4：动作闭合，继续推进 -->
<g><text x="350" y="405" text-anchor="middle">动作全部闭合，更新检查点状态，携完整上下文推进下一轮循环</text><path class="am-edge" d="M160,418 H538" marker-end="url(#recovery-loop-interface-arrow)"/></g>

<!-- 底部说明框 -->
<rect class="am-actor" x="70" y="435" width="560" height="32" rx="3" fill="none" style="fill:none"/>
<text x="350" y="451" text-anchor="middle" font-size="12" fill="var(--ink-2, #4b5260)">核心原则：未知状态绝不盲目重做；物理物证查实才复用，未决则熔断转人工（HITL）</text>
</svg>
