-key="候选提取" data-step="0"><rect class="am-node-shape" x="46.5" y="95" width="80" height="35" rx="3"/><text x="86.5" y="112.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">候选提取</text></g><g class="am-node am-node--rect" data-key="核对来源、范围与冲突" data-step="1"><rect class="am-node-shape" x="14" y="176" width="145" height="35" rx="3"/><text x="86.5" y="193.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">核对来源、范围与冲突</text></g><g class="am-node am-node--rect" data-key="确认后按版本保存" data-step="2"><rect class="am-node-shape" x="107.8" y="257" width="132" height="35" rx="3"/><text x="173.8" y="274.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">确认后按版本保存</text></g><g class="am-node am-node--db" data-key="有效条目与索引" data-step="3"><path class="am-node-shape" d="M114.3,345 A59.5,7 0 0 1 233.3,345 V380 A59.5,7 0 0 1 114.3,380 Z"/><path class="am-node-shape" d="M114.3,345 A59.5,7 0 0 0 233.3,345"/><text x="173.8" y="366.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">有效条目与索引</text></g><g class="am-node am-node--rect" data-key="当前任务与用户信息" data-step="4"><rect class="am-node-shape" x="269.3" y="345" width="119" height="35" rx="3"/><text x="328.8" y="362.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">当前任务与用户信息</text></g><g class="am-node am-node--rect" data-key="范围过滤与检索" data-step="4"><rect class="am-node-shape" x="191.8" y="433" width="119" height="35" rx="3"/><text x="251.3" y="450.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">范围过滤与检索</text></g><g class="am-node am-node--rect" data-key="带来源的Context片段" data-step="6"><rect class="am-node-shape" x="175.1" y="514" width="152.3" height="35" rx="3"/><text x="251.3" y="531.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">带来源的 Context 片段</text></g><g class="am-node am-node--rect" data-key="更正、删除与过期处理" data-step="7"><rect class="am-node-shape" x="195" y="176" width="132" heigh