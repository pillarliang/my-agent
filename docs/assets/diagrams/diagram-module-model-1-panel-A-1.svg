<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 338 468"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
/* Embedded previews can lose html[data-theme]; the fallbacks keep diagrams readable, and defined theme variables still win. */
.am-diagram svg { max-width: 100%; height: auto; font-family: var(--font-sans, sans-serif); }
.am-diagram text { fill: var(--ink, #16181d); font-size: 13px; }
/* Diagram tokens (docs/reference.md, "Diagram tokens"): each painted part reads an optional token and falls back to the look it always had,
   so a theme that sets none of them draws the same diagram. Font family, size and weight are not tokens: diagram text is measured for the sans font. */
.am-node-shape { fill: var(--node-fill, var(--paper, #ffffff)); stroke: var(--node-stroke, var(--line, #1d2026)); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); }
/* A cylinder is two shapes (body, then cap): only the body casts the shadow. */
.am-node-shape ~ .am-node-shape { filter: none; }
/* The corner radius is an SVG attribute (the fallback for Safari before 17.4, which ignores a CSS rx); the default here equals the attribute. A pill and a diamond keep their shape. */
.am-node--rect .am-node-shape, .am-node--er .am-node-shape { rx: var(--node-radius, 3px); }
.am-node--hi .am-node-shape { fill: var(--hi-fill, var(--accent-bg, #e4ecf8)); stroke: var(--hi-stroke, var(--accent, #1d5fbf)); }
.am-diagram .am-node-text { fill: var(--node-text, var(--ink, #16181d)); }
.am-node--hi text { fill: var(--hi-text, var(--accent, #1d5fbf)); font-weight: 600; }
.am-diagram .am-node--hi .am-node-text { fill: var(--hi-text, var(--accent, #1d5fbf)); }
.am-edge { fill: none; stroke: var(--edge-color, var(--ink-2, #4b5260)); stroke-width: var(--edge-width, 1.3); }
.am-edge--dashed { stroke-dasharray: 5 4; }
.am-arrow { fill: var(--edge-color, var(--ink-2, #4b5260)); }
.am-edge-label rect { fill: var(--paper, #ffffff); }
.am-diagram .am-edge-label text { fill: var(--edge-label, var(--accent, #1d5fbf)); font-size: 11.5px; }
.am-cluster { fill: var(--cluster-fill, var(--fill, #f3f5f8)); stroke: var(--cluster-stroke, var(--line-2, #d6dae1)); stroke-width: 1; stroke-dasharray: 4 3; }
.am-diagram .am-cluster-label { fill: var(--ink-2, #4b5260); font: 11px var(--font-mono, monospace); }
/* The PK / FK / UK marks of an entity follow the node text, and the highlighted text in a highlighted entity, so they stay readable on the theme's fills. */
.am-diagram .am-er-key { fill: var(--node-text, var(--ink-2, #4b5260)); }
.am-diagram .am-node--hi .am-er-key { fill: var(--hi-text, var(--ink-2, #4b5260)); }
.am-lifeline { stroke: var(--lifeline-color, var(--ink-3, #8b929e)); stroke-width: 1; stroke-dasharray: 4 4; }
/* An actor (and the box of a divider) looks like a node unless the theme sets the actor tokens. */
.am-actor { fill: var(--actor-fill, var(--node-fill, var(--paper, #ffffff))); stroke: var(--actor-stroke, var(--node-stroke, var(--line, #1d2026))); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); rx: var(--node-radius, 2px); }
.am-diagram .am-actor-text { fill: var(--actor-text, var(--node-text, var(--ink, #16181d))); }
.am-note { fill: var(--note-fill, var(--warn-bg, #fdf3e2)); stroke: var(--note-stroke, var(--warn, #a8620a)); stroke-width: var(--note-width, 1); rx: var(--note-radius, 2px); }
.am-diagram .am-step { fill: var(--ink-3, #8b929e); font: 10px var(--font-mono, monospace); }


svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#16181d}
</style><defs xmlns="http://www.w3.org/2000/svg"><marker id="diagram-module-model-1-panel-A-1-element-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><g xmlns="http://www.w3.org/2000/svg"/><g xmlns="http://www.w3.org/2000/svg"><g data-step="0"><path class="am-edge" d="M172.9,49 L172.9,60.5 Q172.9,72 172.9,83.5 L172.9,95" marker-end="url(#diagram-module-model-1-panel-A-1-element-2)"/></g><g data-step="1"><path class="am-edge" d="M172.9,130 L172.9,141.5 Q172.9,153 172.9,164.5 L172.9,176" marker-end="url(#diagram-module-model-1-panel-A-1-element-2)"/></g><g data-step="2"><path class="am-edge" d="M172.9,211 L172.9,222.5 Q172.9,234 172.9,245.5 L172.9,257" marker-end="url(#diagram-module-model-1-panel-A-1-element-2)"/></g><g data-step="3"><path class="am-edge" d="M207.4,292 L230.1,303.5 Q252.8,315 252.8,326.5 L252.8,338" marker-end="url(#diagram-module-model-1-panel-A-1-element-2)"/></g><g data-step="4"><path class="am-edge" d="M138.4,292 L115.7,303.5 Q93,315 93,326.5 L93,338" marker-end="url(#diagram-module-model-1-panel-A-1-element-2)"/></g><g data-step="5"><path class="am-edge" d="M93,373 L93,384.5 Q93,396 93,407.5 L93,419" marker-end="url(#diagram-module-model-1-panel-A-1-element-2)"/></g></g><g xmlns="http://www.w3.org/2000/svg"><g class="am-node am-node--rect" data-key="Context与调用限制" data-step="0"><rect class="am-node-shape" x="103.3" y="14" width="139.3" height="35" rx="3"/><text x="172.9" y="31.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Context 与调用限制</text></g><g class="am-node am-node--rect" data-key="供应商编码器" data-step="0"><rect class="am-node-shape" x="119.9" y="95" width="106" height="35" rx="3"/><text x="172.9" y="112.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">供应商编码器</text></g><g class="am-node am-node--rect" data-key="真实API请求" data-step="1"><rect class="am-node-shape" x="122" y="176" width="101.8" height="35" rx="3"/><text x="172.9" y="193.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">真实 API 请求</text></g><g class="am-node am-node--rect" data-key="状态与内容解码" data-step="2"><rect class="am-node-shape" x="113.4" y="257" width="119" height="35" rx="3"/><text x="172.9" y="274.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">状态与内容解码</text></g><g class="am-node am-node--rect" data-key="Reply或ModelError" data-step="3"><rect class="am-node-shape" x="182" y="338" width="141.6" height="35" rx="3"/><text x="252.8" y="355.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Reply 或 ModelError</text></g><g class="am-node am-node--rect" data-key="continuation 数据" data-step="4"><rect class="am-node-shape" x="40" y="338" width="106" height="35" rx="3"/><text x="93" y="355.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">continuation 数据</text></g><g class="am-node am-node--rect" data-key="持久记录与下一次编码" data-step="5"><rect class="am-node-shape" x="14" y="419" width="158" height="35" rx="3"/><text x="93" y="436.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">持久记录与下一次编码</text></g></g></svg>
