<g><text x="292" y="305" text-anchor="middle">返回失败及拒绝原因</text><path class="am-edge am-edge--dashed" d="M470,319 H117" marker-end="url(#policy-principles-arrow)"/></g>
<text x="648" y="275" text-anchor="middle" font-size="13">拒绝后不执行，原文件不变</text>
<text x="470" y="365" text-anchor="middle" font-size="13">Policy 判断是否允许；工具系统保证拒绝后不执行</text>
</svg>
