<svg xmlns="http://www.w3.org/2000/svg" class="am-diagram" viewBox="0 0 980 460"><style>.am-diagram { margin: 0; overflow-x: auto; text-align: center; }
.am-diagram svg { max-width: 100%; height: auto; font-family: var(--font-sans, sans-serif); }
.am-diagram text { fill: var(--ink, #16181d); font-size: 13px; }
.am-node-shape { fill: var(--node-fill, var(--paper, #ffffff)); stroke: var(--node-stroke, var(--line, #1d2026)); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); }
.am-node--rect .am-node-shape { rx: var(--node-radius, 3px); }
.am-node--hi .am-node-shape { fill: var(--hi-fill, var(--accent-bg, #e4ecf8)); stroke: var(--hi-stroke, var(--accent, #1d5fbf)); }
.am-diagram .am-node-text { fill: var(--node-text, var(--ink, #16181d)); }
.am-edge { fill: none; stroke: var(--edge-color, var(--ink-2, #4b5260)); stroke-width: var(--edge-width, 1.3); }
.am-edge--dashed { stroke-dasharray: 5 4; }
.am-arrow { fill: var(--edge-color, var(--ink-2, #4b5260)); }
.am-lifeline { stroke: var(--lifeline-color, var(--ink-3, #8b929e)); stroke-width: 1; stroke-dasharray: 4 4; }
.am-actor { fill: var(--actor-fill, var(--node-fill, var(--paper, #ffffff))); stroke: var(--actor-stroke, var(--node-stroke, var(--line, #1d2026))); stroke-width: var(--node-width, var(--bw, 1.5px)); filter: var(--node-shadow, none); rx: var(--node-radius, 2px); }
.am-actor--hi { fill: var(--hi-fill, #eef4fc); stroke: var(--hi-stroke, #2563eb); }
.am-diagram .am-actor-text { fill: var(--actor-text, var(--node-text, var(--ink, #16181d))); font-weight: 600; font-size: 13.5px; }
.am-note-box { fill: #fffbeb; stroke: #d97706; stroke-width: 1; rx: 4px; }
.am-note-text { fill: #92400e; font-size: 12px; font-weight: 500; }
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#16181d}
</style>
<defs><marker id="policy-principles-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<line class="am-lifeline" x1="105" y1="66" x2="105" y2="415"/>
<line class="am-lifeline" x1="355" y1="66" x2="355" y2="415"/>
<line class="am-lifeline" x1="615" y1="66" x2="615" y2="415"/>
<line class="am-lifeline" x1="870" y1="66" x2="870" y2="415"/>
<g><rect class="am-actor" x="15" y="20" width="180" height="46" rx="3"/><text class="am-actor-text" x="105" y="43" text-anchor="middle" dominant-baseline="central">模型 / Runner</text></g>
<g><rect class="am-actor am-actor--hi" x="265" y="20" width="180" height="46" rx="3"/><text class="am-actor-text" x="355" y="43" text-anchor="middle" dominant-baseline="central">工具系统（Harness）</text></g>
<g><rect class="am-actor" x="525" y="20" width="180" height="46" rx="3"/><text class="am-actor-text" x="615" y="43" text-anchor="middle" dominant-baseline="central">物理磁盘（Workspace）</text></g>
<g><rect class="am-actor" x="780" y="20" width="180" height="46" rx="3"/><text class="am-actor-text" x="870" y="43" text-anchor="middle" dominant-baseline="central">权限控制（Policy）</text></g>
<g><text x="230" y="96" text-anchor="middle">1. 调用 write_file(path="summary.txt", ...)</text><path class="am-edge" d="M105,108 H353" marker-end="url(#policy-principles-arrow)"/></g>
<g><text x="485" y="142" text-anchor="middle">2. 检查真实物理状态 lstat(summary.txt)</text><path class="am-edge" d="M355,154 H613" marker-end="url(#policy-principles-arrow)"/></g>
<g><text x="485" y="186" text-anchor="middle">3. 发现目标文件已存在且为普通文件</text><path class="am-edge am-edge--dashed" d="M615,198 H357" marker-end="url(#policy-principles-arrow)"/></g>
<g><rect class="am-note-box" x="200" y="222" width="450" height="30"/><text class="am-note-text" x="425" y="237" text-anchor="middle" dominant-baseline="central">判定动作性质：属于覆盖写！组装 ActionRequest(operation="overwrite")</text></g>
<g><text x="612" y="280" text-anchor="middle">4. evaluate(ActionRequest("overwrite", "summary.txt"))</text><path class="am-edge" d="M355,292 H868" marker-end="url(#policy-principles-arrow)"/></g>
<g><text x="612" y="326" text-anchor="middle">5. PolicyDecision(allowed=False, reason="禁止覆盖已有文件")</text><path class="am-edge am-edge--dashed" d="M870,338 H357" marker-end="url(#policy-principles-arrow)"/></g>
<text x="615" y="366" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="600">安全拦截：Tools 放弃调用底层写入，磁盘原文件完好无损</text>
<g><text x="230" y="386" text-anchor="middle">6. 返回 ToolResult(policy_denied)</text><path class="am-edge am-edge--dashed" d="M355,398 H107" marker-end="url(#policy-principles-arrow)"/></g>
<text x="490" y="445" text-anchor="middle" font-size="13" fill="#475569">模型只负责表达写入意图；Harness 核实物理环境后生成客观动作，由 Policy 决定是否允许</text>
</svg>