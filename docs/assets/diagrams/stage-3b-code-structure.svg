<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title"><title id="title">阶段 3B 后续接入设计：在实际请求保存与模型调用之前选择输入</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172133;font-size:14px}.box{fill:#f4f7fb;stroke:#9dacc2;stroke-width:1.4}.planned{fill:#fffaf0;stroke:#b28a43;stroke-dasharray:6 4}.head{font-size:16px;font-weight:650}.note{fill:#52637b;font-size:13px}.edge{fill:none;stroke:#40516b;stroke-width:1.5}.future{stroke:#9a722c;stroke-dasharray:6 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/></marker></defs>
<rect class="box" x="20" y="20" width="280" height="110" rx="8"/>
<text x="36" y="49" class="head">SessionStore · 已有类</text>
<text x="36" y="77" class="">history() 返回已完成任务消息</text>
<text x="36" y="103" class="">也可直接用内存消息练习</text>
<rect class="box" x="350" y="20" width="300" height="110" rx="8"/>
<text x="366" y="49" class="head">run_agent() · 已有函数</text>
<text x="366" y="77" class="">当前直接拼接全部历史</text>
<text x="366" y="103" class="">后续由 Runner 调用输入选择</text>
<rect class="box planned" x="330" y="250" width="340" height="140" rx="8"/>
<text x="346" y="279" class="head">Context 管理 · 拟新增职责</text>
<text x="346" y="307" class="">选择消息，保持调用与回执配对</text>
<text x="346" y="333" class="">检查输入预算，返回选择说明</text>
<text x="346" y="359" class="">具体函数与类尚未确定</text>
<rect class="box planned" x="720" y="250" width="260" height="140" rx="8"/>
<text x="736" y="279" class="head">超限处理 · 后续设计</text>
<text x="736" y="307" class="">必需内容仍然超限时停止</text>
<text x="736" y="333" class="">不调用模型</text>
<rect class="box" x="330" y="470" width="340" height="110" rx="8"/>
<text x="346" y="499" class="head">ModelRequest · 已有数据类</text>
<text x="346" y="527" class="">messages / tools</text>
<text x="346" y="553" class="">max_output_tokens</text>
<rect class="box" x="330" y="650" width="340" height="85" rx="8"/>
<text x="346" y="679" class="head">已有调用点</text>
<text x="346" y="707" class="">start_step() → model.invoke()</text>
<path class="edge" d="M300 75 H350" marker-end="url(#arrow)"/>
<path class="edge future" d="M500 130 V250" marker-end="url(#arrow)"/>
<text x="515" y="190" class="note">传入候选输入</text>
<path class="edge future" d="M670 320 H720" marker-end="url(#arrow)"/>
<path class="edge future" d="M500 390 V470" marker-end="url(#arrow)"/>
<text x="515" y="435" class="note">检查通过后返回请求</text>
<path class="edge future" d="M500 580 V650" marker-end="url(#arrow)"/>
<text x="500" y="762" class="note" text-anchor="middle">实框：已有函数或类；虚框与虚线：尚未接入的职责与调用。选择说明的存储结构尚未确定。</text>
</svg>
