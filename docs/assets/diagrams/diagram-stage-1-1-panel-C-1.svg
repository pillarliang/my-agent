<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-label="当前阶段 3A：Runner 发送完整历史，SessionStore 记录实际请求、响应、工具结果与最终状态">
<title>阶段 3A 当前的会话记录与请求流程</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172133;font-size:14px}.life{stroke:#c9d2df;stroke-dasharray:5 5}.arrow{fill:none;stroke:#40516b;stroke-width:1.5}.return{stroke-dasharray:6 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/></marker></defs>
<rect x="45" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="140" y="43" text-anchor="middle">SessionStore</text>
<path class="life" d="M140 60 V795"/>
<rect x="285" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="380" y="43" text-anchor="middle">Runner</text>
<path class="life" d="M380 60 V795"/>
<rect x="525" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="620" y="43" text-anchor="middle">LLMService</text>
<path class="life" d="M620 60 V795"/>
<rect x="765" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="860" y="43" text-anchor="middle">Tools / Policy</text>
<path class="life" d="M860 60 V795"/>
<text x="260.0" y="98" text-anchor="middle">创建 Run，保存用户任务</text>
<path class="arrow" d="M380 110 H140" marker-end="url(#arrow)"/>
<text x="260.0" y="162" text-anchor="middle">读取已完成任务的全部历史</text>
<path class="arrow" d="M380 174 H140" marker-end="url(#arrow)"/>
<text x="260.0" y="226" text-anchor="middle">按顺序返回历史消息</text>
<path class="arrow return" d="M140 238 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="290" text-anchor="middle">保存 Step 与实际 ModelRequest</text>
<path class="arrow" d="M380 302 H140" marker-end="url(#arrow)"/>
<text x="500.0" y="354" text-anchor="middle">invoke(ModelRequest)</text>
<path class="arrow" d="M380 366 H620" marker-end="url(#arrow)"/>
<text x="500.0" y="418" text-anchor="middle">完整响应或请求错误</text>
<path class="arrow return" d="M620 430 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="482" text-anchor="middle">先保存模型响应，再判断停止原因</text>
<path class="arrow" d="M380 494 H140" marker-end="url(#arrow)"/>
<text x="620.0" y="546" text-anchor="middle">有工具调用时提交执行</text>
<path class="arrow" d="M380 558 H860" marker-end="url(#arrow)"/>
<text x="620.0" y="610" text-anchor="middle">实际工具结果或拒绝原因</text>
<path class="arrow return" d="M860 622 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="674" text-anchor="middle">保存工具结果，继续下一轮请求</text>
<path class="arrow" d="M380 686 H140" marker-end="url(#arrow)"/>
<text x="260.0" y="738" text-anchor="middle">共同提交最终状态、结果和结束事件</text>
<path class="arrow" d="M380 750 H140" marker-end="url(#arrow)"/>
<text x="500" y="830" text-anchor="middle">当前直接发送完整历史；没有 Context 管理或输入预算裁剪。</text></svg>
