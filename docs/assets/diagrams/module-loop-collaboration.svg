<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 750" role="img" aria-label="通用循环协作：Runner 串联各模块；Context 选输入，Model 生成响应，Tools 执行动作，Policy 检查权限，记录层保存实际调用和结果。">
<title>通用循环协作：Runner 串联各模块；Context 选输入，Model 生成响应，Tools 执行动作，Policy 检查权限，记录层保存实际调用和结果。</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172133;font-size:14px}.life{stroke:#c9d2df;stroke-dasharray:5 5}.arrow{fill:none;stroke:#40516b;stroke-width:1.5}.return{stroke-dasharray:6 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/></marker></defs>
<rect x="45" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="140" y="43" text-anchor="middle">Runner</text>
<path class="life" d="M140 60 V705"/>
<rect x="285" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="380" y="43" text-anchor="middle">Context Manager</text>
<path class="life" d="M380 60 V705"/>
<rect x="525" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="620" y="43" text-anchor="middle">Model</text>
<path class="life" d="M620 60 V705"/>
<rect x="765" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="860" y="43" text-anchor="middle">Tools / Policy</text>
<path class="life" d="M860 60 V705"/>
<rect x="1005" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="1100" y="43" text-anchor="middle">记录层</text>
<path class="life" d="M1100 60 V705"/>
<text x="260.0" y="88" text-anchor="middle">当前任务的消息、历史</text>
<text x="260.0" y="106" text-anchor="middle">工具定义与预算</text>
<path class="arrow" d="M140 118 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="152" text-anchor="middle">输入与选择清单</text>
<text x="260.0" y="170" text-anchor="middle">或构建失败</text>
<path class="arrow return" d="M380 182 H140" marker-end="url(#arrow)"/>
<text x="620.0" y="234" text-anchor="middle">保存本次本次请求的内容</text>
<path class="arrow" d="M140 246 H1100" marker-end="url(#arrow)"/>
<text x="380.0" y="298" text-anchor="middle">请求模型</text>
<path class="arrow" d="M140 310 H620" marker-end="url(#arrow)"/>
<text x="380.0" y="362" text-anchor="middle">完整响应或请求错误</text>
<path class="arrow return" d="M620 374 H140" marker-end="url(#arrow)"/>
<text x="620.0" y="426" text-anchor="middle">保存模型响应</text>
<path class="arrow" d="M140 438 H1100" marker-end="url(#arrow)"/>
<text x="500.0" y="490" text-anchor="middle">提交工具调用</text>
<path class="arrow" d="M140 502 H860" marker-end="url(#arrow)"/>
<text x="500.0" y="554" text-anchor="middle">真实回执或程序异常</text>
<path class="arrow return" d="M860 566 H140" marker-end="url(#arrow)"/>
<text x="620.0" y="618" text-anchor="middle">保存回执；结束时提交结果与最终状态</text>
<path class="arrow" d="M140 630 H1100" marker-end="url(#arrow)"/>
<text x="260.0" y="664" text-anchor="middle">需要继续时</text>
<text x="260.0" y="682" text-anchor="middle">重新构建输入</text>
<path class="arrow" d="M140 694 H380" marker-end="url(#arrow)"/>
<text x="620.0" y="738" text-anchor="middle">实线：发起调用或提交；虚线：返回结果或失败。角色表示职责，不限定具体类。</text></svg>
