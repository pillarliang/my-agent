="am-edge" d="M440.3,236.7 L385,259.3 Q329.7,282 255.7,298.6 L181.8,315.2" marker-end="url(#diagram-module-loop-1-panel-A-1-element-2)"/><g class="am-edge-label"><rect x="319" y="273" width="21.5" height="18" rx="3"/><text x="329.7" y="282" text-anchor="middle" dominant-baseline="central">否</text></g></g><g data-step="7"><path class="am-edge" d="M109.3,349 L109.3,360.5 Q109.3,372 109.3,383.5 L109.3,395" marker-end="url(#diagram-module-loop-1-panel-A-1-element-2)"/></g><g data-step="8"><path class="am-edge am-edge--dashed" d="M91.9,314 L76.1,298 Q60.3,282 60.3,252 Q60.3,222 60.3,192 Q60.3,162 60.3,137.3 Q60.3,112.5 60.3,92.3 Q60.3,72 100.7,60.5 L141.1,49" marker-end="url(#diagram-module-loop-1-panel-A-1-element-2)"/><g class="am-edge-label"><rect x="15" y="153" width="90.5" height="18" rx="3"/><text x="60.3" y="162" text-anchor="middle" dominant-baseline="central">可选修复（限制次数）</text></g></g></g><g xmlns="http://www.w3.org/2000/svg"><g class="am-node am-node--rect" data-key="构建Context与预算检查" data-step="0"><rect class="am-node-shape" x="120" y="14" width="165.3" height="35" rx="3"/><text x="202.6" y="31.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">构建 Context 与预算检查</text></g><g class="am-node am-node--rect" data-key="请求模型并校验响应" data-step="0"><rect class="am-node-shape" x="403.6" y="95" width="145" height="35" rx="3"/><text x="476.1" y="112.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">请求模型并校验响应</text></g><g class="am-node am-node--rect" data-key="停止并保留原因" data-step="1"><rect class="am-node-shape" x="245.9" y="204.5" width="119" height="35" rx="3"/><text x="305.4" y="222" text-anchor="middle" dominant-baseline="central" class="am-node-text">停止并保留原因</text></g><g class="am-node am-node--diamond" data-key="有工具调用?" data-step="3"><polygon class="am-node-shape" points="476.1,194 551.3,222 476.1,250 400.9,222"/><text x="476.1" y="222" text-anchor="middle" dominant-baseline="central" class="am-node-text">有工具调用?</text></g><g class="am-node am-node--rect" data-key="执行工具并保存回执" data-step="4"><rect class="am-node-shape" x="241.4" y="314" width="145" height="35" rx="3"/><text x="313.9" y="331.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">执行工具并保存回执</text></g><g class="am-node am-node--rect" data-key="返回模型说明与执行记录" data-step="6"><rect class="am-node-shape" x="36.8" y="314" width="145" height="35" rx="3"/><text x="109.3" y="331.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">返回模型说明与执行记录</text></g><g class="am-node am-node--rect" data-key="程序结论与证据" data-step="7"><rect class="am-node-shape" x="49.8" y="395" width="119" height="35" rx="3"/><text x="109.3" y="412.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">程序结论与证据</text></g></g></svg>
