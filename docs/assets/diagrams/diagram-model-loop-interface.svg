<line class="am-lifeline" x1="155" y1="66" x2="155" y2="240"/>
<line class="am-lifeline" x1="545" y1="66" x2="545" y2="240"/>
<g><rect class="am-actor" x="35" y="20" width="240" height="46" rx="3"/><text class="am-actor-text" x="155" y="43" text-anchor="middle" dominant-baseline="central">Agent Loop（Runner）</text></g>
<g><rect class="am-actor" x="425" y="20" width="240" height="46" rx="3"/><text class="am-actor-text" x="545" y="43" text-anchor="middle" dominant-baseline="central">Model 系统（LLMService）</text></g>
<g><text x="350" y="115" text-anchor="middle">发送材料，请模型回答（ModelRequest）</text><path class="am-edge" d="M155,128 H543" marker-end="url(#model-loop-interface-arrow)"/></g>
