<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" role="img" aria-label="未来协作示例：写入先核对来源，读取返回候选供 Context 选择；当前尚未实现此 Memory 流程。">
<title>未来协作示例：写入先核对来源，读取返回候选供 Context 选择；当前尚未实现此 Memory 流程。</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172133;font-size:14px}.life{stroke:#c9d2df;stroke-dasharray:5 5}.arrow{fill:none;stroke:#40516b;stroke-width:1.5}.return{stroke-dasharray:6 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/></marker></defs>
<rect x="45" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="140" y="43" text-anchor="middle">用户／写入入口</text>
<path class="life" d="M140 60 V449"/>
<rect x="285" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="380" y="43" text-anchor="middle">Memory</text>
<path class="life" d="M380 60 V449"/>
<rect x="525" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="620" y="43" text-anchor="middle">来源记录</text>
<path class="life" d="M620 60 V449"/>
<rect x="765" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="860" y="43" text-anchor="middle">Context Manager</text>
<path class="life" d="M860 60 V449"/>
<text x="260.0" y="88" text-anchor="middle">明确偏好或候选</text>
<text x="260.0" y="106" text-anchor="middle">适用范围与来源</text>
<path class="arrow" d="M140 118 H380" marker-end="url(#arrow)"/>
<text x="500.0" y="170" text-anchor="middle">核对来源与版本</text>
<path class="arrow" d="M380 182 H620" marker-end="url(#arrow)"/>
<text x="500.0" y="234" text-anchor="middle">原始证据或查询失败</text>
<path class="arrow return" d="M620 246 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="280" text-anchor="middle">写入结果、待确认</text>
<text x="260.0" y="298" text-anchor="middle">或冲突原因</text>
<path class="arrow return" d="M380 310 H140" marker-end="url(#arrow)"/>
<text x="620.0" y="362" text-anchor="middle">任务线索与可访问范围</text>
<path class="arrow" d="M860 374 H380" marker-end="url(#arrow)"/>
<text x="620.0" y="408" text-anchor="middle">有效候选、来源与版本</text>
<text x="620.0" y="426" text-anchor="middle">或查询失败</text>
<path class="arrow return" d="M380 438 H860" marker-end="url(#arrow)"/>
<text x="500.0" y="482" text-anchor="middle">实线：发起调用或提交；虚线：返回结果或失败。角色表示职责，不限定具体类。</text></svg>
