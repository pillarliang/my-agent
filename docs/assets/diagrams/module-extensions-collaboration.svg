<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 622" role="img" aria-label="未来扩展协作示例：方法、回调和工具接入不同模块；当前尚无动态加载器。">
<title>未来扩展协作示例：方法、回调和工具接入不同模块；当前尚无动态加载器。</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172133;font-size:14px}.life{stroke:#c9d2df;stroke-dasharray:5 5}.arrow{fill:none;stroke:#40516b;stroke-width:1.5}.return{stroke-dasharray:6 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40516b"/></marker></defs>
<rect x="45" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="140" y="43" text-anchor="middle">应用装配</text>
<path class="life" d="M140 60 V577"/>
<rect x="285" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="380" y="43" text-anchor="middle">扩展加载器</text>
<path class="life" d="M380 60 V577"/>
<rect x="525" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="620" y="43" text-anchor="middle">Context / Runner</text>
<path class="life" d="M620 60 V577"/>
<rect x="765" y="16" width="190" height="44" rx="8" fill="#f4f7fb" stroke="#9dacc2"/>
<text x="860" y="43" text-anchor="middle">Tools / Policy</text>
<path class="life" d="M860 60 V577"/>
<text x="260.0" y="106" text-anchor="middle">选择包、版本与启用范围</text>
<path class="arrow" d="M140 118 H380" marker-end="url(#arrow)"/>
<text x="260.0" y="170" text-anchor="middle">核对结果或加载失败</text>
<path class="arrow return" d="M380 182 H140" marker-end="url(#arrow)"/>
<text x="500.0" y="234" text-anchor="middle">提供方法索引或注册回调</text>
<path class="arrow" d="M380 246 H620" marker-end="url(#arrow)"/>
<text x="620.0" y="298" text-anchor="middle">注册外部工具定义与适配器</text>
<path class="arrow" d="M380 310 H860" marker-end="url(#arrow)"/>
<text x="500.0" y="362" text-anchor="middle">按需请求方法正文</text>
<path class="arrow" d="M620 374 H380" marker-end="url(#arrow)"/>
<text x="500.0" y="408" text-anchor="middle">限制长度的正文与版本</text>
<text x="500.0" y="426" text-anchor="middle">或读取失败</text>
<path class="arrow return" d="M380 438 H620" marker-end="url(#arrow)"/>
<text x="740.0" y="490" text-anchor="middle">运行时提交模型工具调用</text>
<path class="arrow" d="M620 502 H860" marker-end="url(#arrow)"/>
<text x="740.0" y="536" text-anchor="middle">授权后执行的真实回执</text>
<text x="740.0" y="554" text-anchor="middle">或拒绝／失败</text>
<path class="arrow return" d="M860 566 H620" marker-end="url(#arrow)"/>
<text x="500.0" y="610" text-anchor="middle">实线：发起调用或提交；虚线：返回结果或失败。角色表示职责，不限定具体类。</text></svg>
